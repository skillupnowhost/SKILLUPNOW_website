<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Project Detail — SkillUpNow</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --prj-v:    var(--v1, #441998);
      --prj-cyan: #06b6d4;
      --prj-em:   #10b981;
      --prj-gold: #f59e0b;
      --prj-rose: #f43f5e;
      --pd-r:     20px;
    }

    img { -webkit-user-drag:none; user-drag:none; }
    .pd-page { padding-bottom:7rem; min-height:100vh; }
    .pd-container { max-width:900px; margin:0 auto; padding:0 1.5rem; }

    /* ── Keyframes ── */
    @keyframes pdOrbFloat  { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-18px) scale(1.04)} }
    @keyframes pdShimSweep { to { background-position:-20%; } }
    @keyframes pdPulse     { 0%,100%{opacity:1} 50%{opacity:.55} }
    @keyframes pdSpinAnim  { to { transform:rotate(360deg); } }
    @keyframes pdSlideDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }
    @keyframes pdFadeUp    { from{opacity:0;transform:translateY(26px) scale(.97)} to{opacity:1;transform:none} }
    @keyframes pdGridShift { 0%,100%{opacity:.04} 50%{opacity:.07} }
    @keyframes pdMetaPop   { from{opacity:0;transform:translateY(8px) scale(.9)} to{opacity:1;transform:none} }

    /* ── Hero ── */
    .pd-hero {
      position:relative; overflow:hidden; padding:3.5rem 2rem 2.8rem;
      background:linear-gradient(170deg,#0d0621 0%,#130d2e 50%,#06021a 100%);
      border-bottom:1px solid rgba(109,40,217,.2);
    }
    :root[data-theme="light"] .pd-hero {
      background:linear-gradient(155deg,#fefcff 0%,#f3f0fe 28%,#ebe6fd 58%,#f5f3ff 100%);
      border-bottom-color:rgba(68,25,152,.12);
    }
    .pd-hero::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 60% at 15% 40%, rgba(109,40,217,.38) 0%, transparent 55%),
        radial-gradient(ellipse 65% 55% at 85% 65%, rgba(139,92,246,.28) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 55% 8%,  rgba(6,182,212,.12)  0%, transparent 45%);
    }
    :root[data-theme="light"] .pd-hero::before {
      background:
        radial-gradient(ellipse 80% 60% at 15% 40%, rgba(109,40,217,.12) 0%, transparent 55%),
        radial-gradient(ellipse 65% 55% at 85% 65%, rgba(139,92,246,.08) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 55% 8%,  rgba(6,182,212,.05)  0%, transparent 45%);
    }

    /* Hero grid overlay */
    .pd-hero-grid {
      position:absolute; inset:0; pointer-events:none;
      background-image:linear-gradient(rgba(167,139,250,.55) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(167,139,250,.55) 1px,transparent 1px);
      background-size:54px 54px;
      -webkit-mask-image:radial-gradient(ellipse 85% 80% at 50% 50%,black 25%,transparent 100%);
      mask-image:radial-gradient(ellipse 85% 80% at 50% 50%,black 25%,transparent 100%);
      opacity:.045; animation:pdGridShift 5s ease-in-out infinite;
    }
    :root[data-theme="light"] .pd-hero-grid { opacity:.028; }

    .pd-hero-orb { position:absolute; border-radius:50%; pointer-events:none; }
    .pd-hero-orb1 { width:440px; height:440px; left:-130px; top:-100px;
      background:radial-gradient(circle,rgba(109,40,217,.22) 0%,transparent 70%);
      animation:pdOrbFloat 9s ease-in-out infinite; }
    .pd-hero-orb2 { width:320px; height:320px; right:-80px; bottom:-60px;
      background:radial-gradient(circle,rgba(139,92,246,.18) 0%,transparent 70%);
      animation:pdOrbFloat 11s ease-in-out infinite; animation-delay:-4s; }
    :root[data-theme="light"] .pd-hero-orb1 { background:radial-gradient(circle,rgba(109,40,217,.1) 0%,transparent 70%); }
    :root[data-theme="light"] .pd-hero-orb2 { background:radial-gradient(circle,rgba(139,92,246,.08) 0%,transparent 70%); }

    .pd-hero-inner { position:relative; z-index:2; max-width:860px; margin:0 auto; }

    /* Back button — entrance + hover shine */
    .pd-back {
      display:inline-flex; align-items:center; gap:.45rem;
      padding:.38rem .9rem; border-radius:9px; margin-bottom:1.8rem;
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
      color:rgba(220,200,255,.8); font-size:.78rem; font-weight:700;
      text-decoration:none; cursor:pointer;
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      transition:background .2s, border-color .2s, color .2s, transform .2s, box-shadow .2s;
      animation:pdSlideDown .4s cubic-bezier(.22,1,.36,1) both;
      position:relative; overflow:hidden;
    }
    .pd-back::after {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.12) 50%,transparent 100%);
      transform:translateX(-110%); transition:transform .45s ease;
    }
    .pd-back:hover { background:rgba(255,255,255,.13); color:#fff; border-color:rgba(255,255,255,.3); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.18); }
    .pd-back:hover::after { transform:translateX(110%); }
    :root[data-theme="light"] .pd-back {
      background:rgba(68,25,152,.07); border-color:rgba(68,25,152,.18); color:var(--prj-v);
    }
    :root[data-theme="light"] .pd-back:hover { background:rgba(68,25,152,.14); border-color:rgba(68,25,152,.35); }

    /* Hero type badge */
    .pd-type-badge {
      display:inline-flex; align-items:center; gap:.45rem;
      padding:.3rem 1rem; border-radius:50px; margin-bottom:1.1rem;
      background:rgba(139,92,246,.1); border:1px solid rgba(139,92,246,.35);
      font-size:.67rem; font-weight:800; color:#c084fc;
      letter-spacing:.12em; text-transform:uppercase;
      backdrop-filter:blur(8px);
      box-shadow:0 0 16px rgba(139,92,246,.14), inset 0 1px 0 rgba(255,255,255,.07);
      animation:pdSlideDown .4s .08s cubic-bezier(.22,1,.36,1) both;
    }
    :root[data-theme="light"] .pd-type-badge { background:rgba(68,25,152,.08); border-color:rgba(68,25,152,.28); color:#441998; box-shadow:0 0 14px rgba(68,25,152,.1); }
    .pd-type-dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pdPulse 2s ease-in-out infinite; flex-shrink:0; }

    .pd-hero-row {
      display:flex; align-items:flex-start; gap:1.6rem; flex-wrap:wrap;
      animation:pdFadeUp .52s .18s cubic-bezier(.22,1,.36,1) both;
    }
    .pd-hero-text { flex:1; min-width:0; }
    .pd-hero-title {
      font-size:clamp(1.7rem,4vw,2.8rem); font-weight:900; line-height:1.12;
      letter-spacing:-.03em; margin-bottom:.6rem;
      background:linear-gradient(135deg,#ffffff 0%,#e0d4ff 30%,#c084fc 60%,#67e8f9 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 32px rgba(192,132,252,.22));
    }
    :root[data-theme="light"] .pd-hero-title {
      background:linear-gradient(135deg,#160840 0%,#441998 35%,#5c22c5 65%,#441998 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 24px rgba(68,25,152,.2));
    }

    /* Hero underline accent */
    .pd-hero-underline {
      display:block; width:52px; height:3px; margin:.55rem 0 .9rem;
      background:linear-gradient(90deg,var(--pd-c1,#7c3aed),var(--pd-c2,#06b6d4)); border-radius:2px;
      box-shadow:0 0 12px rgba(192,132,252,.5);
    }
    :root[data-theme="light"] .pd-hero-underline { box-shadow:0 0 10px rgba(109,40,217,.28); }

    .pd-hero-meta { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.5rem; }
    .pd-meta-pill {
      display:inline-flex; align-items:center; gap:.35rem;
      font-size:.78rem; font-weight:600; padding:.28rem .75rem; border-radius:999px;
      transition:transform .2s, filter .2s;
    }
    .pd-meta-pill:hover { transform:scale(1.05); filter:brightness(1.2); }
    .pd-meta-loc  { color:#fb923c; background:rgba(251,146,60,.1);  border:1px solid rgba(251,146,60,.22); }
    .pd-meta-team { color:#38bdf8; background:rgba(56,189,248,.1);  border:1px solid rgba(56,189,248,.22); }
    .pd-meta-dur  { color:#a78bfa; background:rgba(167,139,250,.1); border:1px solid rgba(167,139,250,.22); }
    .pd-meta-pill.pd-m1 { animation:pdMetaPop .4s .32s cubic-bezier(.22,1,.36,1) both; }
    .pd-meta-pill.pd-m2 { animation:pdMetaPop .4s .42s cubic-bezier(.22,1,.36,1) both; }
    .pd-meta-pill.pd-m3 { animation:pdMetaPop .4s .52s cubic-bezier(.22,1,.36,1) both; }

    /* ── Main content ── */
    .pd-main { padding:2.5rem 0 3rem; }

    /* Glass card — scroll-reveal ready */
    .pd-glass-card {
      position:relative; border-radius:var(--pd-r); overflow:hidden;
      margin-bottom:2rem;
      background: color-mix(in srgb, var(--panel) 82%, rgba(255,255,255,.24) 18%);
      border:1px solid var(--border2);
      box-shadow:0 28px 64px rgba(0,0,0,.16);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      /* scroll-reveal initial state */
      opacity:0; transform:translateY(28px);
      transition:opacity .6s cubic-bezier(.22,1,.36,1),
                 transform .6s cubic-bezier(.22,1,.36,1),
                 box-shadow .35s ease,
                 border-color .35s ease;
    }
    .pd-glass-card.pd-in {
      opacity:1; transform:translateY(0);
    }
    .pd-glass-card.pd-in:hover {
      transform:translateY(-5px);
      box-shadow:0 40px 90px rgba(0,0,0,.22),
                 0 0 0 1px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 35%, transparent) inset;
    }
    :root[data-theme="light"] .pd-glass-card {
      background:rgba(255,255,255,.94);
      border-color:rgba(255,255,255,.85);
      box-shadow:0 18px 42px rgba(44,37,89,.07);
    }
    :root[data-theme="light"] .pd-glass-card.pd-in:hover {
      box-shadow:0 24px 56px rgba(68,25,152,.13),
                 0 0 0 1px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 20%, transparent) inset;
    }
    .pd-glass-card::after {
      content:''; position:absolute; inset:0;
      border-radius:inherit; z-index:0; pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    }
    :root[data-theme="light"] .pd-glass-card::after {
      background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.26));
    }
    :root[data-theme="dark"] .pd-glass-card::after {
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    }
    .pd-glass-card > * { position:relative; z-index:1; }

    /* Shimmer — activates on hover */
    .pd-shimmer {
      position:absolute; inset:0; z-index:2; pointer-events:none; border-radius:var(--pd-r);
      background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 48%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.05) 52%,transparent 70%);
      background-size:220% 100%; background-position:220%;
      opacity:0; transition:opacity .3s;
    }
    .pd-glass-card.pd-in:hover .pd-shimmer {
      opacity:1; animation:pdShimSweep .65s ease forwards;
    }

    /* Card inner padding */
    .pd-card-inner { padding:1.8rem 2rem; }
    @media(max-width:600px) { .pd-card-inner { padding:1.3rem 1.2rem; } }

    /* Section label */
    .pd-section-label {
      font-size:.62rem; font-weight:800; color:var(--txt3);
      text-transform:uppercase; letter-spacing:.1em; margin-bottom:.85rem;
      display:flex; align-items:center; gap:.5rem;
      transition:color .2s;
    }
    .pd-section-label::before {
      content:''; display:inline-block; width:3px; height:14px; border-radius:2px;
      background:linear-gradient(to bottom, var(--pd-c1,var(--prj-v)), var(--pd-c2,#06b6d4)); flex-shrink:0;
      transition:height .2s, box-shadow .2s;
    }
    .pd-glass-card.pd-in:hover .pd-section-label::before {
      height:18px; box-shadow:0 0 8px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 60%, transparent);
    }

    /* Description block */
    .pd-desc {
      font-size:.92rem; color:var(--txt2); line-height:1.85;
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 5%, transparent);
      border:1px solid color-mix(in srgb, var(--pd-c1,var(--prj-v)) 12%, transparent);
      border-radius:14px; padding:1.2rem 1.4rem; white-space:pre-wrap; word-break:break-word;
      transition:border-color .25s, background .25s;
    }
    .pd-glass-card.pd-in:hover .pd-desc {
      border-color:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 22%, transparent);
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 7%, transparent);
    }

    /* Facts grid */
    .pd-facts {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:.7rem;
      margin-bottom:0;
    }
    .pd-fact {
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 6%, transparent);
      border:1px solid color-mix(in srgb, var(--pd-c1,var(--prj-v)) 14%, transparent);
      border-radius:14px; padding:.9rem 1.1rem;
      transition:transform .25s cubic-bezier(.22,1,.36,1), border-color .25s, box-shadow .25s, background .25s;
      cursor:default;
    }
    .pd-fact:hover {
      transform:translateY(-3px) scale(1.025);
      border-color:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 42%, transparent);
      box-shadow:0 8px 26px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 14%, transparent);
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 10%, transparent);
    }
    .pd-fact-label { font-size:.63rem; font-weight:800; color:var(--txt3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.3rem; }
    .pd-fact-value { font-size:.95rem; font-weight:800; color:var(--txt); word-break:break-word; }

    /* Tech tags */
    .pd-tags {
      display:flex; flex-wrap:wrap; gap:.65rem; align-items:flex-start;
    }
    .pd-tag {
      display:inline-flex; align-items:center; justify-content:center;
      padding:.55rem 1rem; min-height:38px;
      border-radius:12px; font-size:.83rem; font-weight:700;
      background: color-mix(in srgb, var(--panel) 90%, rgba(255,255,255,.68) 10%);
      border:1px solid var(--border);
      color:var(--txt);
      box-shadow:0 4px 12px rgba(0,0,0,.06);
      text-align:center; white-space:normal; word-break:break-word; overflow-wrap:anywhere;
      transition:transform .22s cubic-bezier(.22,1,.36,1), border-color .22s, box-shadow .22s, color .22s;
      cursor:default;
    }
    .pd-tag:hover {
      transform:translateY(-4px) scale(1.06);
      border-color:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 48%, transparent);
      box-shadow:0 12px 28px rgba(0,0,0,.12), 0 0 0 1px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 22%, transparent);
      color:var(--pd-c1,var(--prj-v));
    }
    :root[data-theme="light"] .pd-tag {
      background:rgba(255,255,255,.94); border-color:rgba(68,25,152,.14); color:var(--txt);
    }
    :root[data-theme="light"] .pd-tag:hover {
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 7%, rgba(255,255,255,.97));
      border-color:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 38%, transparent);
    }

    /* Outcomes */
    .pd-outcomes { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem; }
    .pd-outcomes li {
      display:flex; align-items:flex-start; gap:.65rem;
      font-size:.88rem; color:var(--txt2); line-height:1.65;
      padding:.6rem .95rem; border-radius:12px;
      background:color-mix(in srgb, var(--prj-em) 5%, transparent);
      border:1px solid color-mix(in srgb, var(--prj-em) 14%, transparent);
      transition:transform .2s ease, background .2s, border-color .2s;
      cursor:default;
    }
    .pd-outcomes li:hover {
      transform:translateX(5px);
      background:color-mix(in srgb, var(--prj-em) 10%, transparent);
      border-color:color-mix(in srgb, var(--prj-em) 28%, transparent);
    }
    .pd-outcomes li::before { content:'✦'; color:var(--prj-em); font-size:.58rem; flex-shrink:0; margin-top:.28rem; }

    /* Tasks */
    .pd-tasks { display:flex; flex-direction:column; gap:.6rem; }
    .pd-task {
      display:flex; align-items:flex-start; gap:.7rem;
      padding:.7rem 1rem; border-radius:13px;
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 4%, transparent);
      border:1px solid color-mix(in srgb, var(--pd-c1,var(--prj-v)) 12%, transparent);
      font-size:.87rem; color:var(--txt2); line-height:1.6;
      transition:transform .2s ease, background .2s, border-color .2s;
      cursor:default;
    }
    .pd-task:hover {
      transform:translateX(5px);
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 8%, transparent);
      border-color:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 24%, transparent);
    }
    .pd-task-num {
      flex-shrink:0; width:24px; height:24px; border-radius:8px;
      background:linear-gradient(135deg, var(--pd-c1,var(--prj-v)), #4f46e5);
      display:flex; align-items:center; justify-content:center;
      font-size:.68rem; font-weight:900; color:#fff;
      box-shadow:0 2px 8px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 40%, transparent);
      transition:transform .2s, box-shadow .2s;
    }
    .pd-task:hover .pd-task-num {
      transform:scale(1.12);
      box-shadow:0 4px 16px color-mix(in srgb, var(--pd-c1,var(--prj-v)) 55%, transparent);
    }

    /* Client chip */
    .pd-client {
      display:inline-flex; align-items:center; gap:.6rem;
      padding:.5rem 1.2rem; border-radius:12px;
      background:color-mix(in srgb, var(--pd-c1,var(--prj-v)) 8%, transparent);
      border:1px solid color-mix(in srgb, var(--pd-c1,var(--prj-v)) 18%, transparent);
      font-size:.9rem; color:var(--txt); font-weight:700;
    }

    /* Action bar */
    .pd-action-bar {
      display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-top:2rem;
    }
    .pd-btn-back {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.68rem 1.3rem; border-radius:10px;
      background:var(--panel); border:1px solid var(--border);
      color:var(--txt2); font-size:.85rem; font-weight:700;
      cursor:pointer; font-family:inherit; transition:all .22s; text-decoration:none;
      position:relative; overflow:hidden;
    }
    .pd-btn-back:hover { background:var(--panel2); border-color:var(--border2); color:var(--txt); transform:translateY(-1px); }
    .pd-btn-apply {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.7rem 1.6rem; border-radius:10px;
      background:linear-gradient(135deg, var(--pd-c1,var(--prj-v)), #4f46e5);
      color:#fff; font-size:.85rem; font-weight:700;
      border:none; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 18px color-mix(in srgb, var(--pd-c1,var(--v1)) 32%, transparent);
      transition:transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s;
      text-decoration:none; position:relative; overflow:hidden;
    }
    .pd-btn-apply::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
      opacity:0; transition:opacity .2s;
    }
    .pd-btn-apply:hover { transform:translateY(-3px); box-shadow:0 10px 32px color-mix(in srgb, var(--pd-c1,var(--v1)) 48%, transparent); }
    .pd-btn-apply:hover::before { opacity:1; }

    /* Alerts */
    .pd-alert { padding:1rem 1.2rem; border-radius:13px; font-size:.87rem; display:flex; gap:.75rem; align-items:flex-start; line-height:1.65; }
    .pd-alert.info { background:color-mix(in srgb, var(--pd-c1,var(--v1)) 7%, transparent); border:1px solid color-mix(in srgb, var(--pd-c1,var(--v1)) 22%, transparent); color:var(--prj-v); }

    /* Spinner */
    .pd-spin {
      width:44px; height:44px; margin:5rem auto; display:block;
      border:3px solid var(--border); border-top-color:var(--prj-v);
      border-radius:50%; animation:pdSpinAnim .8s linear infinite;
    }

    /* 404 */
    .pd-not-found { text-align:center; padding:5rem 2rem; }
    .pd-not-found-icon { font-size:3.5rem; display:block; margin-bottom:1rem; opacity:.5; }
    .pd-not-found h2 { font-size:1.2rem; font-weight:800; color:var(--txt); margin-bottom:.5rem; }
    .pd-not-found p { font-size:.88rem; color:var(--txt2); margin-bottom:1.5rem; }

    /* ── 3D Icon system (mirrors project.html) ── */
    @keyframes iconOrbitCW  { to { transform:rotate(360deg); } }
    @keyframes iconOrbitCCW { to { transform:rotateX(55deg) rotate(-360deg); } }

    if (/web|front|react|vue|angular|html|css|full/.test(d))
      return { c1:'#6366f1', c2:'#06b6d4', key:'web',       orbitDur:'4.5s', floatDur:'3.8s', floatStart:'0ms'   };
    if (/machine|ml|ai|deep|neural|gpt|llm/.test(d))
      return { c1:'#8b5cf6', c2:'#ec4899', key:'ai',        orbitDur:'3.2s', floatDur:'3.5s', floatStart:'200ms' };
    if (/data|analytics|sql|database|bi|tableau/.test(d))
      return { c1:'#f59e0b', c2:'#10b981', key:'data',      orbitDur:'5s',   floatDur:'4.2s', floatStart:'100ms' };
    if (/mobile|android|ios|flutter|swift/.test(d))
      return { c1:'#06b6d4', c2:'#3b82f6', key:'mobile',    orbitDur:'4.5s', floatDur:'3.9s', floatStart:'300ms' };
    if (/cloud|aws|azure|gcp|devops|docker|kubernetes/.test(d))
      return { c1:'#38bdf8', c2:'#6366f1', key:'cloud',     orbitDur:'6s',   floatDur:'5s',   floatStart:'500ms' };
    if (/security|cyber|pentest|ethical|hack/.test(d))
      return { c1:'#f43f5e', c2:'#7c5cfc', key:'security',  orbitDur:'3.5s', floatDur:'3.4s', floatStart:'0ms'   };
    if (/game|unity|unreal|3d|ar|vr/.test(d))
      return { c1:'#10b981', c2:'#f59e0b', key:'game',      orbitDur:'2.8s', floatDur:'3s',   floatStart:'150ms' };
    if (/design|figma|adobe|graphic|brand|product/.test(d))
      return { c1:'#ec4899', c2:'#f59e0b', key:'design',    orbitDur:'4.2s', floatDur:'4s',   floatStart:'400ms' };
    if (/backend|api|node|express|django|laravel|spring/.test(d))
      return { c1:'#10b981', c2:'#06b6d4', key:'backend',   orbitDur:'5.5s', floatDur:'4.5s', floatStart:'0ms'   };
    if (/finance|fintech|payment|bank|invest|crypto/.test(d))
      return { c1:'#f59e0b', c2:'#10b981', key:'finance',   orbitDur:'4s',   floatDur:'3.8s', floatStart:'250ms' };
    if (/health|medical|bio|hospital|pharma/.test(d))
      return { c1:'#ef4444', c2:'#10b981', key:'health',    orbitDur:'4.8s', floatDur:'4.2s', floatStart:'100ms' };
    if (/education|learn|teach|school|train|course/.test(d))
      return { c1:'#8b5cf6', c2:'#06b6d4', key:'education', orbitDur:'5.2s', floatDur:'4.5s', floatStart:'0ms'   };
    if (/iot|hardware|embedded|robot|sensor/.test(d))
      return { c1:'#06b6d4', c2:'#10b981', key:'iot',       orbitDur:'3s',   floatDur:'3.2s', floatStart:'200ms' };
    return { c1:'#6366f1', c2:'#06b6d4', key:'default',   orbitDur:'4.5s', floatDur:'4s',   floatStart:'0ms'   };
  }

  /* ── Build 3D icon HTML ── */
  let _pdIconUid = 0;
  function _buildIcon3d(iconData, projectType) {
    const { c1, c2, key, orbitDur, floatDur, floatStart } = iconData;
    const svg = _domainSVGs[key] || _domainSVGs.default;
    const typeBadge = projectType === 'internship'
      ? `<div class="icon-type-badge icon-badge-internship">🎓</div>`
      : projectType === 'upcoming'
        ? `<div class="icon-type-badge icon-badge-upcoming">⏳</div>`
        : projectType === 'completed'
          ? `<div class="icon-type-badge icon-badge-completed">✓</div>`
          : '';
    return `<div class="icon-3d-wrap" style="--oc:${c1};--oc2:${c2};--orbit-dur:${orbitDur}">
      <div class="icon-orbit-ring"></div>
      <div class="icon-orbit-ring2"></div>
      <div class="icon-pulse-a"></div>
      <div class="icon-particle p1"></div>
      <div class="icon-particle p2"></div>
      <div class="pd-icon-orb">
        <div class="icon-svg-wrap" style="--appear-delay:0ms;--float-dur:${floatDur};--float-start:${floatStart}">
          <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">${svg}</svg>
        </div>
      </div>
      ${typeBadge}
    </div>`;
  }

  const _typeLabels = {
    available:  'Available Project',
    internship: 'Internship Programme',
    upcoming:   'Coming Soon',
    completed:  'Completed Project',
  };

  /* ── INIT ── */
  async function pdInit() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) { showNotFound(); return; }

    const sb = window.supabaseConfig?.client;
    if (!sb) { showNotFound(); return; }

    const { data: p, error } = await sb
      .from('internship_projects')
      .select('id,project_name,country,domain,description,detailed_description,client_name,tech_stack,learning_outcomes,tasks,duration_weeks,max_students,team_size,project_type,is_active')
      .eq('id', id)
      .single();

    if (error || !p) { showNotFound(); return; }

    document.title = `${p.project_name} — SkillUpNow`;
    renderHero(p);
    renderMain(p);

    // Auth check
    const { data: { session } } = await sb.auth.getSession();
    renderAction(p, session?.user || null, sb);
  }

  function showNotFound() {
    document.getElementById('pd-hero-content').innerHTML = '';
    document.getElementById('pd-main-content').innerHTML = `
      <div class="pd-not-found">
        <span class="pd-not-found-icon">🔍</span>
        <h2>Project not found</h2>
        <p>The project you're looking for doesn't exist or is no longer available.</p>
        <a class="pd-btn-back" href="project.html">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          Back to Projects
        </a>
      </div>`;
  }

  function renderHero(p) {
    const dc = _getDomainColors(p.domain);
    document.getElementById('pd-hero').style.setProperty('--pd-c1', dc.c1);
    document.getElementById('pd-hero').style.setProperty('--pd-c2', dc.c2);

    const typeLabel = _typeLabels[p.project_type] || 'Project';
    const teamSz = p.team_size || p.max_students || '—';

    document.getElementById('pd-hero-content').innerHTML = `
      <div class="pd-type-badge">
        <span class="pd-type-dot"></span>
        ${_esc(typeLabel)}
      </div>
      <div class="pd-hero-row">
        ${_buildIcon3d(dc, p.project_type)}
        <div class="pd-hero-text">
          <div class="pd-hero-title">${_esc(p.project_name)}</div>
          <span class="pd-hero-underline"></span>
          <div class="pd-hero-meta">
            <span class="pd-meta-pill pd-meta-loc pd-m1">${_svgPin} ${_esc(p.country || '—')}</span>
            <span class="pd-meta-pill pd-meta-team pd-m2">${_svgTeam} ${teamSz} members</span>
            <span class="pd-meta-pill pd-meta-dur pd-m3">${_svgClock} ${p.duration_weeks || '—'} weeks</span>
          </div>
        </div>
      </div>`;
  }

  function renderMain(p) {
    const dc = _getDomainColors(p.domain);
    const techHtml = (p.tech_stack || []).map(t => `<span class="pd-tag">${_esc(t)}</span>`).join('') || '<span style="font-size:.85rem;color:var(--txt3)">Not specified</span>';

    let sections = '';

    // Overview
    const desc = p.detailed_description || p.description || 'No description available.';
    sections += `
      <div class="pd-glass-card" style="--pd-c1:${dc.c1};--pd-c2:${dc.c2}">
        <div class="pd-shimmer"></div>
        <div class="pd-card-inner">
          <div class="pd-section-label">Overview</div>
          <div class="pd-desc">${_esc(desc)}</div>
        </div>
      </div>`;

    // Facts
    sections += `
      <div class="pd-glass-card" style="--pd-c1:${dc.c1};--pd-c2:${dc.c2};animation-delay:.08s">
        <div class="pd-card-inner">
          <div class="pd-section-label">Project Details</div>
          <div class="pd-facts">
            <div class="pd-fact">
              <div class="pd-fact-label">Domain</div>
              <div class="pd-fact-value">${_esc(p.domain || 'General')}</div>
            </div>
            <div class="pd-fact">
              <div class="pd-fact-label">Duration</div>
              <div class="pd-fact-value">${p.duration_weeks ? p.duration_weeks + ' weeks' : '—'}</div>
            </div>
            <div class="pd-fact">
              <div class="pd-fact-label">Team Size</div>
              <div class="pd-fact-value">${(p.team_size || p.max_students) ? (p.team_size || p.max_students) + ' members' : '—'}</div>
            </div>
            <div class="pd-fact">
              <div class="pd-fact-label">Location</div>
              <div class="pd-fact-value">${_esc(p.country || '—')}</div>
            </div>
            ${p.client_name ? `<div class="pd-fact" style="grid-column:1/-1">
              <div class="pd-fact-label">Client / Company</div>
              <div class="pd-fact-value">${_esc(p.client_name)}</div>
            </div>` : ''}
          </div>
        </div>
      </div>`;

    // Tech stack
    sections += `
      <div class="pd-glass-card" style="--pd-c1:${dc.c1};--pd-c2:${dc.c2};animation-delay:.14s">
        <div class="pd-card-inner">
          <div class="pd-section-label">Tech Stack</div>
          <div class="pd-tags">${techHtml}</div>
        </div>
      </div>`;

    // Learning outcomes
    if (p.learning_outcomes?.length) {
      const outHtml = p.learning_outcomes.map(o => `<li>${_esc(o)}</li>`).join('');
      sections += `
        <div class="pd-glass-card" style="--pd-c1:${dc.c1};--pd-c2:${dc.c2};animation-delay:.2s">
          <div class="pd-card-inner">
            <div class="pd-section-label">Learning Outcomes</div>
            <ul class="pd-outcomes">${outHtml}</ul>
          </div>
        </div>`;
    }

    // Tasks
    if (p.tasks?.length) {
      const taskHtml = p.tasks.map((t, i) => {
        const label = typeof t === 'string' ? t : (t.title || t.name || JSON.stringify(t));
        return `<div class="pd-task">
          <div class="pd-task-num">${i + 1}</div>
          <div>${_esc(label)}</div>
        </div>`;
      }).join('');
      sections += `
        <div class="pd-glass-card" style="--pd-c1:${dc.c1};--pd-c2:${dc.c2};animation-delay:.26s">
          <div class="pd-card-inner">
            <div class="pd-section-label">Key Tasks</div>
            <div class="pd-tasks">${taskHtml}</div>
          </div>
        </div>`;
    }

    // Action area placeholder (filled by renderAction)
    sections += `<div id="pd-action-area"></div>`;

    document.getElementById('pd-main-content').innerHTML = sections;

    // Set domain color CSS vars on each card
    document.querySelectorAll('.pd-glass-card').forEach(el => {
      el.style.setProperty('--pd-c1', dc.c1);
      el.style.setProperty('--pd-c2', dc.c2);
    });

    // Scroll-reveal via IntersectionObserver
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('pd-in'), i * 90);
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
    document.querySelectorAll('.pd-glass-card').forEach(el => obs.observe(el));
  }

  async function renderAction(p, user, sb) {
    const area = document.getElementById('pd-action-area');
    if (!area) return;

    let actionHtml = `<div class="pd-action-bar">
      <a class="pd-btn-back" href="project.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Projects
      </a>`;

    if (user) {
      // Check assignment
      const { data: assigns } = await sb
        .from('project_assignments')
        .select('id,status')
        .eq('student_user_id', user.id)
        .eq('status', 'active');
      const isAssigned = (assigns || []).some(a => a.status === 'active');
      if (isAssigned) {
        actionHtml += `<span class="pd-alert info" style="flex:1">✅ You are <strong>assigned</strong> to a project. Visit the Projects page to access your work area.</span>`;
      } else {
        actionHtml += `<span style="font-size:.82rem;color:var(--txt3)">Access by admin assignment only. Contact us if you're interested.</span>`;
      }
    } else {
      actionHtml += `<button class="pd-btn-apply" onclick="window.profileNav&&window.profileNav.openLoginModal()">
        Login to Apply
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>`;
    }

    actionHtml += `</div>`;
    area.innerHTML = actionHtml;
  }

  /* ── Bootstrap ── */
  document.addEventListener('DOMContentLoaded', () => {
    let tries = 0;
    const poll = setInterval(() => {
      if (window.supabaseConfig?.client) {
        clearInterval(poll);
        pdInit();
        return;
      }
      if (++tries > 60) { clearInterval(poll); showNotFound(); }
    }, 100);
  });
  </script>
</body>
</html>
