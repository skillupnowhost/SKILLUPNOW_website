  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemPage",
    "name": "Student Reviews — SkillUpNow",

    "description": "Verified student reviews and testimonials for SkillUpNow IT training courses.",
    "publisher": {
      "@type": "EducationalOrganization",
      "name": "SkillUpNow",
      "url": "https://skillupnowadmin.org/"
    }
  }
  </script>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ══ PAGE SHELL ══ */
    .page-wrap { position:relative; z-index:1; padding-top:0; min-height:100vh; }

    /* ══ HERO ══ */
    .rv-hero {
      background:linear-gradient(155deg,#06030e 0%,#0d0720 22%,#160b35 58%,#0a1230 100%);
      min-height:240px; padding:3rem 2rem 2rem;
      position:relative; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center;
    }
    :root[data-theme="light"] .rv-hero {
      background:linear-gradient(155deg,#f8f6ff 0%,#f0ecff 28%,#e8e2ff 58%,#f5f3ff 100%);
    }
    .rv-hero::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse 55% 70% at 8% 45%,rgba(124,92,252,.2) 0%,transparent 55%),
        radial-gradient(ellipse 45% 55% at 92% 55%,rgba(61,107,255,.18) 0%,transparent 52%);
      animation:rvHeroOrb 14s ease-in-out infinite;
    }
    @keyframes rvHeroOrb{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.05)}}
    .rv-hero::after {
      content:''; position:absolute; inset:0; pointer-events:none;
      background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:22px 22px;
      -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%);
      mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%);
    }
    .rv-hero-inner { position:relative; z-index:2; max-width:640px; }
    .rv-hero-kicker {
      display:inline-flex; align-items:center; gap:.45rem;
      background:rgba(124,92,252,.14); border:1px solid rgba(124,92,252,.35);
      border-radius:999px; padding:.3rem .95rem;
      font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
      color:#a78bfa; margin-bottom:1rem;
    }
    :root[data-theme="light"] .rv-hero-kicker { color:#7c5cfc; background:rgba(124,92,252,.1); }
    .rv-hero h1 {
      font-size:clamp(1.9rem,4vw,2.8rem); font-weight:900; line-height:1.15;
      color:#fff; margin-bottom:.6rem; letter-spacing:-.02em;
    }
    :root[data-theme="light"] .rv-hero h1 { color:#1e1b4b; }
    .rv-hero-accent { background:linear-gradient(135deg,#a78bfa,#67e8f9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    :root[data-theme="light"] .rv-hero-accent { background:linear-gradient(135deg,#7c5cfc,#3d6bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .rv-hero p { font-size:.95rem; color:rgba(255,255,255,.62); max-width:480px; line-height:1.65; margin:0 auto; }
    :root[data-theme="light"] .rv-hero p { color:rgba(30,27,75,.58); }

    /* ══ STATS BAR ══ */
    .rv-stats {
      display:flex; justify-content:center; flex-wrap:wrap;
      background:var(--panel); border-bottom:1.5px solid var(--border);
    }
    .rv-stat {
      display:flex; align-items:center; gap:.65rem;
      padding:1rem 2.5rem; border-right:1px solid var(--border);
    }
    .rv-stat:last-child { border-right:none; }
    .rv-stat-icon { font-size:1.4rem; }
    .rv-stat-num { font-size:1.2rem; font-weight:900; color:var(--txt); line-height:1; }
    .rv-stat-lbl { font-size:.72rem; color:var(--txt3); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }

    /* ══ MAIN LAYOUT ══ */
    .rv-main { max-width:1260px; margin:0 auto; padding:2rem 1.5rem 3rem; }

    /* ══ FILTER BAR ══ */
    .rv-filter-bar {
      display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
      margin-bottom:2rem; padding-bottom:1.5rem;
      border-bottom:1.5px solid var(--border);
    }
    .rv-filter-group { display:flex; gap:.45rem; flex-wrap:wrap; }
    .rv-filter-btn {
      display:inline-flex; align-items:center; gap:.35rem;
      padding:.38rem .95rem; border-radius:999px;
      border:1.5px solid var(--border); background:transparent;
      font-size:.78rem; font-weight:700; color:var(--txt3);
      cursor:pointer; font-family:inherit;
      transition:all .2s cubic-bezier(.4,0,.2,1);
    }
    .rv-filter-btn:hover { border-color:rgba(124,92,252,.4); color:var(--txt); }
    .rv-filter-btn.active {
      background:linear-gradient(135deg,#7c5cfc,#3d6bff);
      border-color:transparent; color:#fff;
      box-shadow:0 4px 14px rgba(124,92,252,.35);
    }
    .rv-filter-sep { width:1px; height:28px; background:var(--border); flex-shrink:0; }

    /* ══ CATEGORY SECTION ══ */
    .rv-cat-section { margin-bottom:3rem; }
    .rv-cat-header {
      display:flex; align-items:center; gap:.85rem;
      margin-bottom:1.5rem; padding-bottom:.75rem;
      border-bottom:1px solid var(--border);
    }
    .rv-cat-icon { font-size:1.5rem; }
    .rv-cat-title { font-size:1.1rem; font-weight:800; color:var(--txt); }
    .rv-cat-count {
      display:inline-flex; align-items:center;
      padding:.15rem .65rem; border-radius:999px;
      background:rgba(124,92,252,.1); border:1px solid rgba(124,92,252,.2);
      font-size:.7rem; font-weight:800; color:var(--v1);
    }

    /* ══ REVIEW GRID ══ */
    .rv-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
      gap:1.4rem;
    }

    /* ══ REVIEW CARD (full page version — same design as carousel) ══ */
    @keyframes rvCardFadeUp {
      from { opacity:0; transform:translateY(20px) scale(.98); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes rvStarPulse {
      0%,70%,100% { filter:none; transform:scale(1); }
      85% { filter:drop-shadow(0 0 6px rgba(251,191,36,.9)); transform:scale(1.22); }
    }

    .rv-full-card {
      background:var(--panel); border:1.5px solid var(--border);
      border-radius:22px; padding:1.5rem 1.4rem 1.3rem;
      display:flex; flex-direction:column;
      position:relative; overflow:hidden;
      animation:rvCardFadeUp .4s both;
      transition:transform .28s cubic-bezier(.34,1.56,.64,1), border-color .25s, box-shadow .25s;
    }
    .rv-full-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg,#7c5cfc,#3d6bff,#67e8f9);
      border-radius:22px 22px 0 0;
    }
    .rv-full-card:hover {
      transform:translateY(-7px) scale(1.01);
      border-color:rgba(124,92,252,.45);
      box-shadow:0 20px 55px rgba(124,92,252,.18), 0 4px 12px rgba(0,0,0,.08);
    }

    /* Stars */
    .rv-full-card-top {
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:.5rem; margin-bottom:.95rem;
    }
    .rv-full-stars { display:flex; gap:.08rem; }
    .rv-full-star { font-size:1.25rem; display:inline-block; color:rgba(255,255,255,.12); }
    :root[data-theme="light"] .rv-full-star:not(.on) { color:rgba(0,0,0,.1); }
    .rv-full-star.on { color:#fbbf24; animation:rvStarPulse 3.5s ease-in-out infinite; }

    /* Badge */
    .rv-full-badge {
      display:inline-flex; align-items:center; gap:.28rem; flex-shrink:0;
      padding:.17rem .6rem; border-radius:999px;
      font-size:.64rem; font-weight:800; text-transform:capitalize; letter-spacing:.04em;
      color:var(--rvf-dot,#7c5cfc);
      background:color-mix(in srgb,var(--rvf-dot,#7c5cfc) 12%,transparent);
      border:1px solid color-mix(in srgb,var(--rvf-dot,#7c5cfc) 28%,transparent);
    }
    @supports not (color:color-mix(in srgb,red,blue)){.rv-full-badge{background:rgba(124,92,252,.1);border-color:rgba(124,92,252,.25);}}
    .rv-full-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--rvf-dot,#7c5cfc);}

    /* Quote */
    .rv-full-quote-wrap { position:relative; flex:1; margin-bottom:.75rem; }
    .rv-full-quote-icon {
      position:absolute; top:-10px; left:-5px;
      font-size:3rem; line-height:1; font-family:Georgia,serif;
      color:rgba(124,92,252,.14); pointer-events:none; user-select:none;
    }
    :root[data-theme="light"] .rv-full-quote-icon { color:rgba(124,92,252,.1); }
    .rv-full-text {
      font-size:.875rem; line-height:1.78; color:var(--txt2);
      padding-left:1.4rem; margin:0;
      display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden;
    }
    .rv-full-text.expanded { -webkit-line-clamp:unset; }
    .rv-full-readmore {
      background:none; border:1px solid rgba(124,92,252,.28); border-radius:999px;
      padding:.2rem .8rem; font-size:.72rem; font-weight:700; color:var(--v1);
      cursor:pointer; font-family:inherit; margin:.5rem 0 .75rem;
      display:inline-block; transition:background .2s, transform .2s;
    }
    .rv-full-readmore:hover { background:rgba(124,92,252,.1); transform:scale(1.04); }

    /* Meta row */
    .rv-full-meta {
      display:flex; gap:.65rem; flex-wrap:wrap; margin-bottom:.7rem;
    }
    .rv-full-meta-item {
      display:flex; align-items:center; gap:.3rem;
      font-size:.73rem; color:var(--txt3);
    }
    .rv-full-meta-item span { font-size:.85rem; }

    /* Footer */
    .rv-full-footer {
      display:flex; align-items:center; gap:.65rem;
      padding-top:.85rem; margin-top:auto;
      border-top:1px solid rgba(255,255,255,.07);
    }
    :root[data-theme="light"] .rv-full-footer { border-top-color:var(--border); }
    .rv-full-avatar {
      width:38px; height:38px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:.82rem; font-weight:800; color:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.25);
    }
    .rv-full-author-name { font-weight:700; font-size:.84rem; color:var(--txt); }
    .rv-full-author-sub  { font-size:.7rem; color:var(--txt4); margin-top:.05rem; }

    /* ══ LOAD MORE ══ */
    .rv-load-more-wrap { text-align:center; margin-top:2rem; display:none; }
    .rv-load-more-btn {
      display:inline-flex; align-items:center; gap:.55rem;
      padding:.7rem 1.8rem; border-radius:14px;
      background:var(--panel); border:1.5px solid var(--border);
      color:var(--txt2); font-size:.88rem; font-weight:700; cursor:pointer;
      font-family:inherit; transition:all .22s;
    }
    .rv-load-more-btn:hover { border-color:var(--v1); color:var(--v1); transform:translateY(-2px); }
    .rv-load-more-btn:disabled { opacity:.4; pointer-events:none; }

    /* ══ EMPTY STATE ══ */
    .rv-full-empty {
      text-align:center; padding:4rem 1.5rem;
      border:1.5px dashed rgba(124,92,252,.2); border-radius:20px;
      color:var(--txt4); font-size:.92rem; line-height:1.7;
      display:none; grid-column:1/-1;
    }
    .rv-full-empty.show { display:block; }
    .rv-full-empty-icon { font-size:2.5rem; margin-bottom:.6rem; opacity:.5; display:flex; justify-content:center; }
    .rv-full-empty-icon svg { width:40px; height:40px; color:#f43f5e; overflow:visible; }

    /* ══ LOADING SKELETON ══ */
    @keyframes rvSkelShimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .rv-skel {
      border-radius:22px; height:220px;
      background:linear-gradient(90deg,var(--border) 25%,rgba(124,92,252,.05) 50%,var(--border) 75%);
      background-size:200% 100%;
      animation:rvSkelShimmer 1.6s ease-in-out infinite;
    }

    /* ══ MODAL ══ */
    @keyframes rvModalIn { from{opacity:0;transform:translateY(32px) scale(.95)} to{opacity:1;transform:none} }
    #rvp-modal {
      position:fixed; inset:0; z-index:99995;
      background:rgba(6,3,18,.72);
      backdrop-filter:blur(22px) saturate(1.6); -webkit-backdrop-filter:blur(22px) saturate(1.6);
      display:flex; align-items:center; justify-content:center; padding:1.2rem;
      opacity:0; visibility:hidden; transition:opacity .28s, visibility .28s;
    }
    #rvp-modal.open { opacity:1; visibility:visible; }
    #rvp-modal-box {
      background:var(--panel); border:1.5px solid rgba(124,92,252,.28);
      border-radius:28px; padding:2.4rem 2rem 2rem;
      max-width:540px; width:94vw; position:relative;
      box-shadow:0 40px 80px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.06);
    }
    #rvp-modal.open #rvp-modal-box { animation:rvModalIn .32s cubic-bezier(.22,1,.36,1) both; }
    .rvp-modal-close {
      position:absolute; top:1rem; right:1rem; width:32px; height:32px; border-radius:50%;
      border:1.5px solid rgba(124,92,252,.3); background:rgba(124,92,252,.1); color:var(--v1);
      font-size:.85rem; font-weight:700; display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-family:inherit; transition:background .2s, transform .2s;
    }
    .rvp-modal-close:hover { background:var(--v1); color:#fff; transform:rotate(90deg); }
    #rvp-modal-stars { display:flex; gap:.28rem; margin-bottom:1.2rem; }
    #rvp-modal-stars .rv-full-star { font-size:1.4rem; }
    #rvp-modal-body { font-size:.93rem; color:var(--txt2); line-height:1.85; margin:0 0 1.5rem; max-height:55vh; overflow-y:auto; }
    .rvp-modal-author { display:flex; align-items:center; gap:.75rem; padding-top:1rem; border-top:1px solid var(--border); }
    :root[data-theme="light"] #rvp-modal-box { background:rgba(255,255,255,.97); }

    /* ══ LIQUID GLASS SORT DROPDOWN ══ */
    .rv-sort-wrap { position:relative; }
    .rv-sort-trigger {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.38rem .9rem;
      border-radius:999px;
      border:1px solid rgba(124,92,252,.28);
      background:rgba(124,92,252,.08);
      -webkit-backdrop-filter:blur(16px) saturate(180%);
      backdrop-filter:blur(16px) saturate(180%);
      color:var(--txt); font-size:.78rem; font-weight:700;
      font-family:inherit; cursor:pointer; white-space:nowrap;
      box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
      transition:background .2s, border-color .2s, box-shadow .2s;
    }
    .rv-sort-trigger:hover {
      background:rgba(124,92,252,.15); border-color:rgba(124,92,252,.5);
      box-shadow:0 4px 16px rgba(124,92,252,.18), 0 1px 0 rgba(255,255,255,.1) inset;
    }
    .rv-sort-trigger .rv-sort-chevron { transition:transform .25s cubic-bezier(.34,1.56,.64,1); flex-shrink:0; }
    .rv-sort-wrap.open .rv-sort-chevron { transform:rotate(180deg); }
    .rv-sort-wrap.open .rv-sort-trigger {
      background:rgba(124,92,252,.18); border-color:rgba(124,92,252,.55);
      box-shadow:0 6px 24px rgba(124,92,252,.24), 0 1px 0 rgba(255,255,255,.12) inset;
    }
    :root[data-theme="light"] .rv-sort-trigger {
      background:rgba(255,255,255,.82); border-color:rgba(124,92,252,.22);
      box-shadow:0 2px 8px rgba(124,92,252,.09), 0 1px 0 rgba(255,255,255,.95) inset;
      color:var(--txt);
    }
    :root[data-theme="light"] .rv-sort-trigger:hover {
      background:rgba(124,92,252,.07); border-color:rgba(124,92,252,.42);
    }
    :root[data-theme="light"] .rv-sort-wrap.open .rv-sort-trigger {
      background:rgba(124,92,252,.09); border-color:rgba(124,92,252,.48);
    }

    /* Dropdown panel */
    .rv-sort-panel {
      position:absolute; top:calc(100% + .5rem); right:0; z-index:400;
      min-width:178px; border-radius:18px; padding:.4rem;
      background:rgba(12,6,32,.93);
      -webkit-backdrop-filter:blur(32px) saturate(200%);
      backdrop-filter:blur(32px) saturate(200%);
      border:1px solid rgba(124,92,252,.34);
      box-shadow:0 24px 64px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.07) inset;
      opacity:0; visibility:hidden;
      transform:translateY(-8px) scale(.96);
      transition:opacity .22s, visibility .22s, transform .22s cubic-bezier(.22,1,.36,1);
      pointer-events:none;
    }
    :root[data-theme="light"] .rv-sort-panel {
      background:rgba(255,255,255,.97);
      border-color:rgba(124,92,252,.18);
      box-shadow:0 16px 48px rgba(124,92,252,.15), 0 2px 8px rgba(0,0,0,.06),
                 0 2px 0 rgba(255,255,255,.95) inset;
    }
    .rv-sort-wrap.open .rv-sort-panel {
      opacity:1; visibility:visible;
      transform:translateY(0) scale(1); pointer-events:auto;
    }
    .rv-sort-opt {
      display:flex; align-items:center; width:100%; text-align:left;
      padding:.54rem .88rem; border-radius:11px; border:none;
      background:transparent; color:var(--txt2);
      font-size:.8rem; font-weight:600; font-family:inherit; cursor:pointer;
      transition:background .15s, color .15s; position:relative;
    }
    .rv-sort-opt:hover { background:rgba(124,92,252,.12); color:var(--txt); }
    .rv-sort-opt.active {
      background:linear-gradient(135deg,rgba(124,92,252,.22),rgba(61,107,255,.16));
      color:var(--v1); font-weight:800;
    }
    .rv-sort-opt.active::after {
      content:'✓'; position:absolute; right:.88rem;
      font-size:.72rem; color:var(--v1); font-weight:900;
    }
    :root[data-theme="light"] .rv-sort-opt { color:var(--txt2); }
    :root[data-theme="light"] .rv-sort-opt:hover { background:rgba(124,92,252,.08); color:var(--txt); }
    :root[data-theme="light"] .rv-sort-opt.active {
      background:rgba(124,92,252,.1); color:var(--v1);
    }

    /* Sort + count meta row */
    .rv-filter-meta-row {
      display:flex; align-items:center; gap:.75rem;
      flex-shrink:0; margin-left:auto;
    }
    .rv-result-count { font-size:.82rem; color:var(--txt3); white-space:nowrap; }

    /* ══ RESPONSIVE — FULL MOBILE REDESIGN ══ */
    @media(max-width:700px){
      .rv-hero { padding:2rem 1.25rem 1.5rem; }
      .rv-main { padding:1.5rem 1rem 2.5rem; }

      /* Stats: 2×2 grid */
      .rv-stats {
        display:grid; grid-template-columns:1fr 1fr;
      }
      .rv-stat {
        padding:.85rem 1.1rem; border-right:none;
        border-bottom:1px solid var(--border);
      }
      .rv-stat:nth-child(odd)  { border-right:1px solid var(--border); }
      .rv-stat:nth-last-child(-n+2) { border-bottom:none; }

      /* Filter bar: stacked */
      .rv-filter-bar {
        flex-direction:column; align-items:stretch;
        gap:.65rem; padding-bottom:1.25rem;
      }
      .rv-filter-group {
        width:100%; min-width:0;
        flex-wrap:nowrap; overflow-x:auto;
        -webkit-overflow-scrolling:touch;
        scrollbar-width:none; padding-bottom:.2rem;
      }
      .rv-filter-group::-webkit-scrollbar { display:none; }
      .rv-filter-btn { flex-shrink:0; white-space:nowrap; }
      .rv-filter-sep { display:none; }

      /* Sort + count: own row, right-aligned */
      .rv-filter-meta-row { margin-left:0; justify-content:space-between; width:100%; }

      /* Grid: single column */
      .rv-grid { grid-template-columns:1fr; }

      /* Sort panel: left-aligned on mobile */
      .rv-sort-panel { right:auto; left:0; }
    }
    @media(max-width:480px){
      .rv-full-card { padding:1.2rem 1rem 1rem; }
      .rv-stat { padding:.75rem .9rem; }
      .rv-stat-icon svg { width:26px; height:26px; }
      .rv-stat-num { font-size:1.05rem; }
      .rv-stat-lbl { font-size:.66rem; }
      .rv-hero h1 { font-size:clamp(1.55rem,5vw,2.1rem); }
    }
    @media(max-width:380px){
      .rv-filter-btn { padding:.3rem .68rem; font-size:.71rem; gap:.26rem; }
      .rv-filt-ico svg { width:12px; height:12px; }
    }

    /* ===== ANIMATED SVG ICONS — PROJECT-PAGE STYLE ===== */
    @keyframes siBob   { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-2.5px)} }
    @keyframes siFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-3px) scale(1.04)} }
    @keyframes siBlink { 0%,44%,56%,100%{opacity:1} 50%{opacity:.08} }
    @keyframes siSpin  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes siSlide { 0%,100%{transform:translateX(0)} 55%{transform:translateX(2.5px)} }
    @keyframes siDrop  { 0%,100%{transform:translateY(-3px);opacity:0} 40%,80%{transform:translateY(3px);opacity:1} 99%{opacity:0} }
    @keyframes siPulse { 0%,100%{opacity:.6;transform:scale(.88)} 50%{opacity:1;transform:scale(1.08)} }

    .si-bob   { animation:siBob   2.8s ease-in-out infinite;      transform-box:fill-box; transform-origin:center; }
    .si-bob2  { animation:siBob   2.8s ease-in-out infinite .55s; transform-box:fill-box; transform-origin:center; }
    .si-float { animation:siFloat 3.2s ease-in-out infinite;      transform-box:fill-box; transform-origin:center; }
    .si-blink { animation:siBlink 1.6s ease-in-out infinite; }
    .si-spin  { animation:siSpin  9s linear infinite;             transform-box:fill-box; transform-origin:center; }
    .si-slide { animation:siSlide 2s ease-in-out infinite;        transform-box:fill-box; transform-origin:left center; }
    .si-drop  { animation:siDrop  2.4s ease-in-out infinite;      transform-box:fill-box; transform-origin:center; }
    .si-pulse { animation:siPulse 2.2s ease-in-out infinite;      transform-box:fill-box; transform-origin:center; }

    /* Delay helpers */
    .ad-1 { animation-delay:.14s; }
    .ad-2 { animation-delay:.28s; }
    .ad-3 { animation-delay:.42s; }
    .ad-4 { animation-delay:.56s; }
    .ad-5 { animation-delay:.8s;  }
    .ad-6 { animation-delay:.9s;  }

    /* Icon colour classes */
    .rv-ico-violet  { color:#7c5cfc; }
    .rv-ico-amber   { color:#f59e0b; }
    .rv-ico-cyan    { color:#06b6d4; }
    .rv-ico-emerald { color:#10b981; }
    .rv-ico-rose    { color:#f43f5e; }
    .rv-ico-star    { color:#fbbf24; }

    /* Stats bar animated icons */
    .rv-stat-icon { font-size:1.4rem; display:flex; align-items:center; justify-content:center; }
    .rv-stat-icon svg {
      width:30px; height:30px; overflow:visible;
      filter:drop-shadow(0 0 7px color-mix(in srgb, currentColor 55%, transparent));
      transition:filter .3s, transform .32s cubic-bezier(.22,1,.36,1);
    }
    .rv-stat:hover .rv-stat-icon svg {
      filter:drop-shadow(0 0 15px color-mix(in srgb, currentColor 85%, transparent));
      transform:scale(1.14) translateY(-2px);
    }

    /* Filter button animated icons */
    .rv-filt-ico { display:inline-flex; align-items:center; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
    .rv-filt-ico svg { width:14px; height:14px; overflow:visible; transition:filter .25s; }
    .rv-filter-btn:hover .rv-filt-ico { transform:scale(1.22) translateY(-1px); }
    .rv-filter-btn:hover .rv-filt-ico svg { filter:drop-shadow(0 0 5px color-mix(in srgb, currentColor 85%, transparent)); }
    .rv-filter-btn.active .rv-filt-ico svg { filter:drop-shadow(0 0 4px rgba(255,255,255,.55)); }

    /* Hero kicker icon */
    .rv-kicker-ico { display:inline-flex; align-items:center; }
    .rv-kicker-ico svg { width:13px; height:13px; overflow:visible; }
  </style>

<script>
/* ── Constants ── */
const RVP_GRADS = ['linear-gradient(135deg,#7c5cfc,#3d6bff)','linear-gradient(135deg,#06b6d4,#0284c7)','linear-gradient(135deg,#a855f7,#7c3aed)','linear-gradient(135deg,#10b981,#059669)','linear-gradient(135deg,#f59e0b,#d97706)','linear-gradient(135deg,#ef4444,#dc2626)'];
const RVP_TYPE_COLORS = { course:'#7c5cfc', mentor:'#3d6bff', website:'#06b6d4', admin:'#f59e0b', general:'#10b981' };
const RVP_TYPE_ICONS  = {
  course:  `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
  mentor:  `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
  website: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>`,
  admin:   `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="10" width="18" height="11" rx="1"/><path d="M3 10L12 3l9 7"/><line x1="12" y1="10" x2="12" y2="21"/></svg>`,
  general: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
};
const RVP_TYPE_LABELS = { course:'Course', mentor:'Mentor', website:'Website', admin:'Admin', general:'General' };
const RVP_PAGE_SIZE   = 12;

let _rvpAll      = [];   // all loaded data
let _rvpFiltered = [];   // after category filter
let _rvpSorted   = [];   // after sort
let _rvpPage     = 0;
let _rvpCat      = 'all';
let _rvpSortVal  = 'newest';
const _rvpModalStore = {};

function _rvpEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _rvpCleanText(text) {
  if (!text) return '';
  const posM = text.match(/\[Positives\]:\s*([\s\S]*?)(?=\[Improvements\]:|$)/i);
  const impM = text.match(/\[Improvements\]:\s*([\s\S]*?)(?=\[Aspect Ratings\]:|$)/i);
  if (posM || impM) {
    const p = [];
    if (posM && posM[1].trim()) p.push(posM[1].trim());
    if (impM && impM[1].trim()) p.push(impM[1].trim());
    if (p.length) return p.join(' ');
  }
  const cleaned = text.replace(/\[(?:Mentor|Course\/Batch|Topic|Priority|Category|Device\/Browser|Site Rating|Aspect Ratings)[^\]]*\]:[^\n]*/gi, '').replace(/\n{3,}/g, '\n\n').trim();
  return cleaned || text.trim();
}

function _rvpBuildCard(f, idx) {
  const type = f.feedback_type || (f.source === 'review' ? 'course' : 'general');
  const comment = _rvpCleanText(f.comment || f.message || '');
  const isLong = comment.length > 280;
  const preview = isLong ? comment.slice(0, 280).trimEnd() + '…' : comment;
  const name = f._name || 'Student';
  const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const course = f.course_title || '';
  const dotColor = RVP_TYPE_COLORS[type] || '#7c5cfc';
  const grad = RVP_GRADS[idx % RVP_GRADS.length];
  const rating = Math.min(5, Math.max(0, parseInt(f.rating) || 0));
  const typeLabel = RVP_TYPE_LABELS[type] || type;
  const typeIcon  = RVP_TYPE_ICONS[type]  || '💬';
  const dateStr = f.created_at ? new Date(f.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '';
  const starsHtml = Array.from({length:5}, (_, i) =>
    `<span class="rv-full-star${i < rating ? ' on' : ''}" ${i < rating ? `style="animation-delay:${(i*.12).toFixed(2)}s"` : ''} aria-hidden="true">★</span>`
  ).join('');
  const rvpKey = 'rvp_' + idx;
  _rvpModalStore[rvpKey] = { comment, rating, name, typeLabel, grad };
  return `<div class="rv-full-card" style="animation-delay:${(idx%RVP_PAGE_SIZE*.04).toFixed(2)}s">
    <div class="rv-full-card-top">
      <div class="rv-full-stars" aria-label="${rating} out of 5">${starsHtml}</div>
      <span class="rv-full-badge" style="--rvf-dot:${dotColor}">${typeIcon} ${typeLabel}</span>
    </div>
    <div class="rv-full-quote-wrap">
      <div class="rv-full-quote-icon">❝</div>
      <p class="rv-full-text" id="rvp-t-${idx}">${_rvpEsc(preview)}</p>
    </div>
    ${isLong ? `<button class="rv-full-readmore" onclick="rvpOpenModal('${rvpKey}')">Read full review →</button>` : ''}
    <div class="rv-full-meta">
      ${course ? `<div class="rv-full-meta-item"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>${_rvpEsc(course.substring(0,36)+(course.length>36?'…':''))}</div>` : ''}
      ${dateStr ? `<div class="rv-full-meta-item"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>${dateStr}</div>` : ''}
    </div>
    <div class="rv-full-footer">
      <div class="rv-full-avatar" style="background:${grad}">${initials}</div>
      <div>
        <div class="rv-full-author-name">${_rvpEsc(name)}</div>
        <div class="rv-full-author-sub">${course ? _rvpEsc(course.substring(0,32)+(course.length>32?'…':'')) : typeLabel+' Review'}</div>
      </div>
    </div>
  </div>`;
}

function rvpRender(append) {
  const grid = document.getElementById('rvp-grid');
  const start = append ? _rvpPage * RVP_PAGE_SIZE : 0;
  const slice = _rvpSorted.slice(start, start + RVP_PAGE_SIZE);
  const totalShown = start + slice.length;
  const hasMore = totalShown < _rvpSorted.length;
  if (!append) grid.innerHTML = '';
  if (!_rvpSorted.length) {
    grid.innerHTML = '<div class="rv-full-empty show"><div class="rv-full-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><p>No reviews found for this filter.</p></div>';
  } else {
    grid.insertAdjacentHTML('beforeend', slice.map((f, i) => _rvpBuildCard(f, start + i)).join(''));
  }
  const lmWrap = document.getElementById('rvp-load-more-wrap');
  const lmBtn  = document.getElementById('rvp-load-more');
  if (lmWrap) lmWrap.style.display = hasMore ? 'block' : 'none';
  if (lmBtn)  lmBtn.disabled = false;
  const count = document.getElementById('rvp-count');
  if (count) count.textContent = `${_rvpSorted.length} review${_rvpSorted.length !== 1 ? 's' : ''}`;
}

function rvpApplyFilters() {
  _rvpPage = 0;
  _rvpFiltered = _rvpCat === 'all' ? [..._rvpAll] : _rvpAll.filter(f => {
    const t = f.feedback_type || (f.source === 'review' ? 'course' : 'general');
    return t === _rvpCat;
  });
  _rvpSorted = [..._rvpFiltered].sort((a, b) => {
    if (_rvpSortVal === 'highest') return (b.rating || 0) - (a.rating || 0);
    if (_rvpSortVal === 'lowest')  return (a.rating || 0) - (b.rating || 0);
    return new Date(b.created_at) - new Date(a.created_at);
  });
  rvpRender(false);
}

function rvpSetFilter(cat) {
  _rvpCat = cat;
  document.querySelectorAll('.rv-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  rvpApplyFilters();
}

function rvpSort(val) {
  _rvpSortVal = val;
  rvpApplyFilters();
}

/* ── Liquid glass sort dropdown ── */
function rvpToggleSort(e) {
  e.stopPropagation();
  const wrap = document.getElementById('rvp-sort-wrap');
  const open = wrap.classList.toggle('open');
  document.getElementById('rvp-sort-trigger').setAttribute('aria-expanded', open);
}
function rvpSelectSort(val, label, el) {
  _rvpSortVal = val;
  document.getElementById('rvp-sort-label').textContent = label;
  document.querySelectorAll('.rv-sort-opt').forEach(o =>
    o.classList.toggle('active', o.dataset.val === val)
  );
  const wrap = document.getElementById('rvp-sort-wrap');
  wrap.classList.remove('open');
  document.getElementById('rvp-sort-trigger').setAttribute('aria-expanded', 'false');
  rvpApplyFilters();
}
document.addEventListener('click', function() {
  const wrap = document.getElementById('rvp-sort-wrap');
  if (!wrap) return;
  wrap.classList.remove('open');
  const trigger = document.getElementById('rvp-sort-trigger');
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
});

function rvpLoadMore() {
  _rvpPage++;
  rvpRender(true);
}

/* Modal */
function rvpOpenModal(key) {
  const d = _rvpModalStore[key]; if (!d) return;
  const m = document.getElementById('rvp-modal'); if (!m) return;
  const starsHtml = Array.from({length:5}, (_, i) =>
    `<span class="rv-full-star${i<d.rating?' on':''}" ${i<d.rating?`style="animation-delay:${(i*.12).toFixed(2)}s"`:''} aria-hidden="true">★</span>`
  ).join('');
  document.getElementById('rvp-modal-stars').innerHTML = starsHtml;
  document.getElementById('rvp-modal-body').textContent = '\u201c' + d.comment + '\u201d';
  const initials = d.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const av = document.getElementById('rvp-modal-avatar');
  av.style.background = d.grad; av.textContent = initials;
  document.getElementById('rvp-modal-name').textContent = d.name;
  document.getElementById('rvp-modal-type').textContent = d.typeLabel + ' Review';
  m.classList.add('open'); document.body.style.overflow = 'hidden';
}
function rvpCloseModal() {
  const m = document.getElementById('rvp-modal'); if (m) m.classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') rvpCloseModal(); });

/* Filter button wiring */
document.querySelectorAll('.rv-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => rvpSetFilter(btn.dataset.cat));
});

/* Main data load */
async function rvpLoad() {
  let tries = 0;
  while (!window.supabaseConfig?.getClient() && tries++ < 20)
    await new Promise(r => setTimeout(r, 150));
  const client = window.supabaseConfig?.getClient();
  if (!client) { document.getElementById('rvp-grid').innerHTML = '<p style="color:var(--txt4);text-align:center;grid-column:1/-1;padding:3rem">Unable to connect. Please refresh.</p>'; return; }

  try {
    const [rvRes, fbRes] = await Promise.all([
      client.from('reviews')
        .select('id,comment,rating,created_at,user_id,course_id')
        .eq('is_approved', true)
        .order('created_at', { ascending: false })
        .limit(200),
      client.from('feedback')
        .select('id,message,rating,full_name,course_title,feedback_type,created_at,user_id')
        .not('rating', 'is', null)
        .in('status', ['reviewed', 'resolved'])
        .order('created_at', { ascending: false })
        .limit(100)
    ]);

    const rvRows = rvRes.data || [];
    const fbRows = fbRes.data || [];

    // Fetch user names and course titles separately
    const uids = [...new Set([...rvRows, ...fbRows].map(r => r.user_id).filter(Boolean))];
    const cids = [...new Set(rvRows.map(r => r.course_id).filter(Boolean))];
    const [psRes, csRes] = await Promise.all([
      uids.length ? client.from('user_profiles').select('user_id,full_name').in('user_id', uids) : Promise.resolve({ data: [] }),
      cids.length ? client.from('courses').select('id,title').in('id', cids) : Promise.resolve({ data: [] })
    ]);
    const nameMap   = Object.fromEntries((psRes.data || []).map(p => [p.user_id, p.full_name]));
    const courseMap = Object.fromEntries((csRes.data  || []).map(c => [c.id, c.title]));

    const reviews  = rvRows.map(r => ({ ...r, source:'review', feedback_type:'course', course_title: courseMap[r.course_id] || '' }));
    const feedback = fbRows.map(f => ({ ...f, source:'feedback', comment: f.message }));

    reviews.forEach(r  => { r._name = r.user_id ? nameMap[r.user_id] || 'Student' : 'Student'; });
    feedback.forEach(f => { f._name = f.user_id ? nameMap[f.user_id] || f.full_name || 'Student' : f.full_name || 'Student'; });

    _rvpAll = [...reviews, ...feedback].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    // Stats
    const total = _rvpAll.length;
    const courseCount  = _rvpAll.filter(f => (f.feedback_type||'course') === 'course').length;
    const mentorCount  = _rvpAll.filter(f => (f.feedback_type||'') === 'mentor').length;
    const withRatings  = _rvpAll.filter(f => f.rating);
    const avgRating    = withRatings.length ? (withRatings.reduce((s,f) => s + (f.rating||0), 0) / withRatings.length).toFixed(1) : '—';
    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-courses').textContent = courseCount;
    document.getElementById('stat-mentors').textContent = mentorCount;
    document.getElementById('stat-avg').textContent     = avgRating + (avgRating !== '—' ? '★' : '');

    rvpApplyFilters();
  } catch(e) {
    document.getElementById('rvp-grid').innerHTML = '<p style="color:var(--txt4);text-align:center;grid-column:1/-1;padding:3rem">Failed to load reviews. Please try again.</p>';
  }
}

rvpLoad();
</script>
