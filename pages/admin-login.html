<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — SkillUpNow</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #060412; font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden; position: relative;
    }
    nav { display: none !important; }
    footer { display: none !important; }
    .page-wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .auth-shell { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

    /* ── Animated background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 25%, rgba(124,92,252,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 85% 75%, rgba(61,107,255,0.2) 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(168,85,247,0.08) 0%, transparent 60%),
        #060412;
    }
    .grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(124,92,252,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,92,252,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.05); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-20px,30px) scale(0.95); } }
    .orb1 { position: fixed; width: 350px; height: 350px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,252,0.18), transparent 70%); top: -80px; left: -80px; z-index: 0; animation: float1 8s ease-in-out infinite; }
    .orb2 { position: fixed; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(61,107,255,0.15), transparent 70%); bottom: -60px; right: -60px; z-index: 0; animation: float2 10s ease-in-out infinite; }

    /* ── Card ── */
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.035);
      border: 1.5px solid rgba(124,92,252,0.22);
      border-radius: 28px;
      padding: 2.75rem 2.5rem 2.25rem;
      width: 100%; max-width: 440px;
      margin: 1rem;
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: 0 32px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(124,92,252,0.8), rgba(61,107,255,0.6), transparent);
      border-radius: 28px 28px 0 0;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(28px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ── Brand ── */
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-logo-img { height: 60px; width: auto; object-fit: contain; margin-bottom: .75rem; }
    .brand-logo {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #9b8fff 0%, #7c6cff 50%, #5b3fd4 100%);
      border-radius: 18px; margin: 0 auto 0.9rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; box-shadow: 0 10px 28px rgba(124,108,255,0.45);
      animation: pulseLogo 3s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%,100% { box-shadow: 0 10px 28px rgba(124,108,255,0.45); }
      50% { box-shadow: 0 14px 36px rgba(124,108,255,0.65), 0 0 0 8px rgba(124,92,252,0.08); }
    }
    .brand h2 { color: #f0eeff; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand p  { color: rgba(200,191,255,0.55); font-size: 0.82rem; margin-top: 0.25rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: rgba(124,92,252,0.15); border: 1px solid rgba(124,92,252,0.3);
      border-radius: 999px; padding: 0.22rem 0.75rem;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #b5adff; margin-top: 0.6rem;
    }

    /* ── Alert ── */
    .alert { padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.82rem; margin-bottom: 1.2rem; display: none; line-height: 1.55; }
    .alert.error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.28); color: #fca5a5; }
    .alert.success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.28);  color: #86efac; }
    .alert.show { display: block; }

    /* ── Form ── */
    .form-title { font-size: 1.1rem; font-weight: 800; color: #f0eeff; margin-bottom: 0.3rem; }
    .form-sub   { font-size: 0.8rem; color: rgba(200,191,255,0.45); margin-bottom: 1.6rem; line-height: 1.5; }
    .f-group { margin-bottom: 1.1rem; }
    .f-group label {
      display: block; font-size: 0.73rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: rgba(200,191,255,0.45); margin-bottom: 0.4rem;
    }
    .input-wrap { position: relative; }
    .f-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: rgba(155,143,255,0.4); font-size: 0.95rem; pointer-events: none; }
    .f-group input {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(124,92,252,0.18); border-radius: 14px;
      padding: 0.8rem 1rem 0.8rem 2.65rem;
      color: #f0eeff; font-size: 0.9rem; font-family: inherit;
      outline: none; transition: all 0.22s;
    }
    .f-group input:focus {
      border-color: rgba(155,143,255,0.65); background: rgba(124,92,252,0.07);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.14);
    }
    .f-group input::placeholder { color: rgba(200,191,255,0.22); }
    .pw-toggle {
      position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: rgba(155,143,255,0.4);
      cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: color 0.2s;
    }
    .pw-toggle:hover { color: #9b8fff; }

    /* ── Submit button ── */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #9b8fff 0%, #7c6cff 50%, #9b8fff 100%);
      background-size: 200% 100%;
      color: #fff; border: none; border-radius: 14px;
      padding: 0.9rem; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 8px 24px rgba(124,108,255,0.4);
      transition: all 0.3s; position: relative; overflow: hidden;
      animation: btnGlow 3s ease-in-out infinite;
    }
    @keyframes btnGlow {
      0%,100% { box-shadow: 0 8px 24px rgba(124,108,255,0.4); }
      50% { box-shadow: 0 10px 32px rgba(124,108,255,0.65); }
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.14) 50%, transparent 70%);
      transform: translateX(-120%); transition: transform 0.5s ease;
    }
    .btn:hover::after { transform: translateX(120%); }
    .btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; animation: none; }

    /* ── Spinner ── */
    .spin { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: rotate 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
    @keyframes rotate { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .card-footer { text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: rgba(200,191,255,0.3); display: flex; flex-direction: column; gap: 0.5rem; }
    .card-footer a { color: rgba(155,143,255,0.6); text-decoration: none; transition: color 0.2s; }
    .card-footer a:hover { color: #9b8fff; }
    .ssl-note { display: flex; align-items: center; justify-content: center; gap: 0.35rem; }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0; }
    .divider hr { flex: 1; border: none; border-top: 1px solid rgba(124,92,252,0.15); }
    .divider span { font-size: 0.7rem; color: rgba(200,191,255,0.25); white-space: nowrap; }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="orb1"></div>
<div class="orb2"></div>
<nav></nav>

<div class="page-wrap">
<main class="auth-shell">
<div class="card">
  <div class="brand">
    <img src="../icon/Logo.png" alt="SkillUpNow" class="brand-logo-img" onerror="this.style.display='none';">
    <p>Administration Portal</p>
    <span class="badge">🔒 Restricted Access</span>
  </div>

  <!-- Alert -->
  <div class="alert error"   id="err-alert"></div>
  <div class="alert success" id="suc-alert"></div>

  <!-- Login form -->
  <div class="form-title">Welcome Back, Admin</div>
  <div class="form-sub">Sign in with your admin credentials to access the dashboard</div>

  <div class="f-group">
    <label>Admin Email</label>
    <div class="input-wrap">
      <span class="f-icon">✉</span>
      <input type="email" id="a-email" placeholder="skillupnowoff@gmail.com" autocomplete="username" required>
    </div>
  </div>

  <div class="f-group">
    <label>Password</label>
    <div class="input-wrap">
      <span class="f-icon">🔒</span>
      <input type="password" id="a-pass" placeholder="Enter your password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" onclick="togglePw(this)">Show</button>
    </div>
  </div>

  <button type="button" class="btn" id="login-btn" onclick="doLogin()">
    <span id="login-label">Sign In to Dashboard →</span>
  </button>

  <div class="divider"><hr><span>New admin account?</span><hr></div>
  <a href="admin-signup" style="display:block;text-align:center;font-size:0.8rem;color:rgba(155,143,255,0.7);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='#9b8fff'" onmouseout="this.style.color='rgba(155,143,255,0.7)'">Create admin account with invite code →</a>

  <div class="card-footer">
    <div class="ssl-note">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      256-bit SSL encrypted · Authorized personnel only
    </div>
    <a href="../">← Return to Website</a>
  </div>
</div>
</main>
<footer></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase-config.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/profile-nav.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   ADMIN LOGIN — simple email + password, no OTP required
   ═══════════════════════════════════════════════════════════ */

const ADMIN_ROLES = ['admin', 'super_admin', 'support'];
const db = new SupabaseConfig();

/* ── Helpers ── */
function togglePw(btn) {
  const inp = document.getElementById('a-pass');
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  btn.textContent = isText ? 'Show' : 'Hide';
}

function showErr(msg) {
  const el = document.getElementById('err-alert');
  const su = document.getElementById('suc-alert');
  su.classList.remove('show');
  el.textContent = msg;
  el.classList.add('show');
}

function showSuc(msg) {
  const el = document.getElementById('suc-alert');
  const er = document.getElementById('err-alert');
  er.classList.remove('show');
  el.textContent = msg;
  el.classList.add('show');
}

function setLoading(loading) {
  const btn = document.getElementById('login-btn');
  const lbl = document.getElementById('login-label');
  btn.disabled = loading;
  lbl.innerHTML = loading
    ? '<span class="spin"></span> Verifying…'
    : 'Sign In to Dashboard →';
}

/* ── Main login handler ── */
/* ── Field highlighting helpers ── */
function setFieldError(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.borderColor = 'rgba(239,68,68,0.6)';
  el.style.boxShadow   = '0 0 0 3px rgba(239,68,68,0.12)';
}
function clearFieldErrors() {
  ['a-email','a-pass'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.borderColor = ''; el.style.boxShadow = ''; }
  });
}

async function doLogin() {
  clearFieldErrors();
  const email = document.getElementById('a-email').value.trim().toLowerCase();
  const pass  = document.getElementById('a-pass').value;

  if (!email) {
    setFieldError('a-email');
    return showErr('⚠ Email address is required.');
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setFieldError('a-email');
    return showErr('⚠ Please enter a valid email address.');
  }
  if (!pass) {
    setFieldError('a-pass');
    return showErr('⚠ Password is required.');
  }

  setLoading(true);

  try {
    /* 1. Supabase auth sign-in */
    const { data: authData, error: authErr } = await db.client.auth.signInWithPassword({
      email, password: pass
    });
    if (authErr) {
      const msg = authErr.message || '';
      const code = authErr.code || '';
      // Exact credential mismatch
      if (msg.includes('Invalid login credentials') || code === 'invalid_credentials' ||
          msg.includes('invalid_credentials') || msg.includes('wrong password'))
        throw new Error('⚠ Incorrect email or password — please check your credentials and try again.');
      // Too many attempts
      if (msg.includes('too many') || msg.includes('rate limit') || code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit')
        throw new Error('⚠ Too many failed attempts. Please wait a few minutes before trying again.');
      // Email not verified
      if (msg.includes('Email not confirmed') || code === 'email_not_confirmed')
        throw new Error('⚠ Your email address has not been confirmed. Please check your inbox or contact support.');
      // Account disabled / banned
      if (msg.includes('banned') || msg.includes('disabled') || msg.includes('blocked'))
        throw new Error('⚠ This account has been disabled. Contact support for assistance.');
      // Network / server errors
      if (msg.includes('fetch') || msg.includes('network') || msg.includes('Failed to fetch'))
        throw new Error('⚠ Network error — check your connection and try again.');
      // Fallback with original message
      throw new Error('⚠ Sign-in failed: ' + (msg || 'Please try again.'));
    }

    const userId = authData.user?.id;
    if (!userId) throw new Error('⚠ Sign-in returned no user. Please try again.');

    /* 2. Parallel role check — user_profiles + user_role_assignments */
    const [{ data: profile }, { data: roleRow }] = await Promise.all([
      db.client.from('user_profiles')
        .select('role, full_name')
        .eq('user_id', userId)
        .maybeSingle(),
      db.client.from('user_role_assignments')
        .select('role')
        .eq('user_id', userId)
        .in('role', ADMIN_ROLES)
        .eq('is_active', true)
        .maybeSingle()
    ]);

    const isAdmin = ADMIN_ROLES.includes(profile?.role) || ADMIN_ROLES.includes(roleRow?.role);
    if (!isAdmin) {
      await db.client.auth.signOut();
      setFieldError('a-email');
      setFieldError('a-pass');
      throw new Error('⚠ Access denied — this account does not have admin privileges. Contact your super-admin if this is a mistake.');
    }

    /* 3. Store lightweight session flag for dashboard and redirect */
    const adminRole = profile?.role || roleRow?.role || 'admin';
    sessionStorage.setItem('admin_session', JSON.stringify({
      email, userId, role: adminRole,
      name: profile?.full_name || email.split('@')[0],
      at: Date.now()
    }));

    showSuc('✓ Welcome back! Redirecting to dashboard…');
    setTimeout(() => { window.location.href = 'admin-dashboard'; }, 700);

  } catch (err) {
    showErr(err.message || '⚠ Authentication failed. Please try again.');
    setLoading(false);
  }
}

/* Clear field error styles on input */
document.addEventListener('DOMContentLoaded', () => {
  ['a-email','a-pass'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', clearFieldErrors);
  });
});

/* ── Enter key support ── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('a-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('a-email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('a-pass').focus();
  });

  /* Auto-redirect if already logged in as admin */
  (async () => {
    try {
      const { data: { session } } = await db.client.auth.getSession();
      if (!session) return;
      const { data: profile } = await db.client.from('user_profiles')
        .select('role').eq('user_id', session.user.id).maybeSingle();
      const { data: roleRow } = await db.client.from('user_role_assignments')
        .select('role').eq('user_id', session.user.id)
        .in('role', ADMIN_ROLES).eq('is_active', true).maybeSingle();
      if (ADMIN_ROLES.includes(profile?.role) || ADMIN_ROLES.includes(roleRow?.role)) {
        window.location.href = 'admin-dashboard';
      }
    } catch (_) {}
  })();
});
</script>
</body>
</html>
