      if (v.sessionNumber) chips.push(`<span class="rv-dv-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Session ${v.sessionNumber}</span>`);
      if (v.isNew) chips.push(`<span class="rv-dv-chip" style="color:var(--v1);border-color:rgba(124,92,252,.3);background:rgba(124,92,252,.08);">✨ New</span>`);
      chipsEl.innerHTML = chips.join('');
    }

    // Meta row: legacy fallback (kept for compatibility)
    const metaParts = [];
    if (metaEl) metaEl.innerHTML = metaParts.join('');

    // Price / access badge
    if (priceRow) {
      if (v._access === 'full') {
        priceRow.innerHTML = `<span class="rv-dv-badge-free"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Unlocked</span>`;
      } else if (v._access === 'locked') {
        priceRow.innerHTML = `<span class="rv-dv-badge-paid">Sign in to watch</span>`;
      } else if (v._access === 'unpaid') {
        priceRow.innerHTML = v.totalPrice != null
          ? `<span class="rv-dv-price">₹${Number(v.totalPrice).toLocaleString('en-IN')}</span><span class="rv-dv-badge-paid">Purchase required</span>`
          : `<span class="rv-dv-badge-paid">Purchase required</span>`;
      } else if (v.totalPrice != null) {
        priceRow.innerHTML = `<span class="rv-dv-price">₹${Number(v.totalPrice).toLocaleString('en-IN')}</span><span class="rv-dv-badge-paid">Purchase required</span>`;
      } else {
        priceRow.innerHTML = `<span class="rv-dv-badge-paid">Members only</span>`;
      }
    }

    // Wire play button
    if (playBtn) {
      playBtn.onclick = () => handleWatchClick(id);
      playBtn.disabled = false;
      playBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Play Video`;
    }

    // Show details, hide placeholder + player
    const placeholder = document.getElementById('rv-player-placeholder');
    const playerEl    = document.getElementById('rv-player');
    const detailsView = document.getElementById('rv-details-view');
    const nowPlaying  = document.getElementById('rv-now-playing');

    if (placeholder) placeholder.style.display = 'none';
    if (playerEl)    { playerEl.style.display = 'none'; playerEl.innerHTML = ''; }
    if (detailsView) detailsView.classList.add('active');
    if (nowPlaying)  nowPlaying.style.display = 'none';

    // Highlight playlist item
    _activeVideoId = v.id;
    document.querySelectorAll('.rv-pi').forEach(el => el.classList.remove('active'));
    const piEl = document.getElementById('pi-' + v.id);
    if (piEl) {
      piEl.classList.add('active');
      piEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Scroll to top of main panel on mobile
    document.getElementById('rv-player-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Get current session user ──
  async function _rvGetUser() {
    try {
      const { data: { session } } = await window.supabaseConfig?.client?.auth?.getSession() || { data: {} };
      return session?.user || null;
    } catch(_) { return null; }
  }

  // ── Build tiled watermark HTML ──
  function _rvWatermark(label) {
    let h = '';
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 4; c++) {
        h += `<span class="rv-watermark-text" style="top:${r*22+4}%;left:${c*28-8}%;">${label}</span>`;
      }
    }
    return h;
  }

  // ── Format seconds → m:ss ──
  function _rvFmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  // ── Wire custom controls to a native <video> element ──
  function _rvWireVideo(video, wrapEl) {
    const progFill  = wrapEl.querySelector('.rv-progress-fill');
    const timeTxt   = wrapEl.querySelector('.rv-time-txt');
    const playBtn   = wrapEl.querySelector('.rv-play-btn');
    const progTrack = wrapEl.querySelector('.rv-progress-track');
    const speedSel  = wrapEl.querySelector('.rv-speed-sel');
    const fsBtn     = wrapEl.querySelector('.rv-fs-btn');

    const syncPlayBtn = () => {
      if (!playBtn) return;
      playBtn.innerHTML = video.paused
        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
    };

    video.addEventListener('play',  syncPlayBtn);
    video.addEventListener('pause', syncPlayBtn);
    video.addEventListener('loadedmetadata', () => {
      if (timeTxt) timeTxt.textContent = '0:00 / ' + _rvFmt(video.duration);
    });
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      if (progFill) progFill.style.width = (video.currentTime / video.duration * 100) + '%';
      if (timeTxt) timeTxt.textContent = _rvFmt(video.currentTime) + ' / ' + _rvFmt(video.duration);
    });

    playBtn?.addEventListener('click', e => { e.stopPropagation(); video.paused ? video.play() : video.pause(); });

    progTrack?.addEventListener('click', e => {
      const r = progTrack.getBoundingClientRect();
      video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (video.duration || 0);
    });
    progTrack?.addEventListener('touchstart', e => {
      const r = progTrack.getBoundingClientRect();
      video.currentTime = Math.max(0, Math.min(1, (e.touches[0].clientX - r.left) / r.width)) * (video.duration || 0);
    }, { passive: true });

    speedSel?.addEventListener('change', () => { video.playbackRate = parseFloat(speedSel.value); });

    const doFs = e => {
      if (e) e.stopPropagation();
      const wrap = document.getElementById('rv-player-wrap');
      if (!document.fullscreenElement) {
        (wrap?.requestFullscreen || wrap?.webkitRequestFullscreen || wrap?.mozRequestFullScreen)?.call(wrap);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen)?.call(document);
      }
    };
    fsBtn?.addEventListener('click', doFs);

    // Click on wrap area (outside controls) → toggle play/pause
    wrapEl.addEventListener('click', e => {
      if (e.target.closest('.rv-ctrl-bar') || e.target.closest('.rv-dim-overlay')) return;
      video.paused ? video.play() : video.pause();
    });

    // Auto-hide controls
    let _ht;
    const showCtrl = () => {
      wrapEl.classList.add('rv-show-ctrl');
      clearTimeout(_ht);
      _ht = setTimeout(() => wrapEl.classList.remove('rv-show-ctrl'), 3000);
    };
    wrapEl.addEventListener('mousemove', showCtrl);
    wrapEl.addEventListener('touchstart', showCtrl, { passive: true });
  }

  // ── Wire YouTube iframe controls via postMessage ──
  function _rvWireYT(iframe, wrapEl) {
    let _paused = false;
    const playBtn  = wrapEl.querySelector('.rv-play-btn');
    const speedSel = wrapEl.querySelector('.rv-speed-sel');
    const fsBtn    = wrapEl.querySelector('.rv-fs-btn');

    const ytCmd = (fn, arg) => {
      try { iframe.contentWindow?.postMessage(JSON.stringify({ event:'command', func:fn, args: arg !== undefined ? [arg] : [] }), '*'); } catch(_) {}
    };

    const syncPlayBtn = (paused) => {
      if (!playBtn) return;
      playBtn.innerHTML = paused
        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
    };

    playBtn?.addEventListener('click', e => {
      e.stopPropagation(); _paused = !_paused;
      ytCmd(_paused ? 'pauseVideo' : 'playVideo'); syncPlayBtn(_paused);
    });
    speedSel?.addEventListener('change', () => ytCmd('setPlaybackRate', parseFloat(speedSel.value)));
    fsBtn?.addEventListener('click', e => {
      e.stopPropagation();
      const wrap = document.getElementById('rv-player-wrap');
      if (!document.fullscreenElement) {
        (wrap?.requestFullscreen || wrap?.webkitRequestFullscreen || wrap?.mozRequestFullScreen)?.call(wrap);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen)?.call(document);
      }
    });

    // Click on wrap area to toggle play/pause
    wrapEl.addEventListener('click', e => {
      if (e.target.closest('.rv-ctrl-bar') || e.target.closest('.rv-dim-overlay')) return;
      _paused = !_paused; ytCmd(_paused ? 'pauseVideo' : 'playVideo'); syncPlayBtn(_paused);
    });

    // Register global pause hook (cleared when new video loads)
    _rvPauseCurrent = () => { ytCmd('pauseVideo'); _paused = true; syncPlayBtn(true); };

    // Auto-hide controls
    let _ht;
    const showCtrl = () => {
      wrapEl.classList.add('rv-show-ctrl');
      clearTimeout(_ht);
      _ht = setTimeout(() => wrapEl.classList.remove('rv-show-ctrl'), 3000);
    };
    wrapEl.addEventListener('mousemove', showCtrl);
    wrapEl.addEventListener('touchstart', showCtrl, { passive: true });
  }

  // ── Build secure embed HTML (async — needs user session for watermark) ──
  async function _rvBuildEmbed(v) {
    const user = await _rvGetUser();
    const rawEmail = user?.email || '';
    const wLabel = rawEmail
      ? rawEmail.slice(0, 3) + '***' + rawEmail.slice(rawEmail.indexOf('@')) + ' · SkillUpNow'
      : '© SkillUpNow · Unauthorized sharing prohibited';
    const wm = _rvWatermark(wLabel);

    const dimHtml = `<div class="rv-dim-overlay" id="rv-dim">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Video paused</span>
      </div>`;

    const fsBtn = `<button class="rv-ctrl-btn rv-fs-btn" title="Fullscreen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>`;

    const speedCtrl = `<select class="rv-speed-sel" title="Playback speed">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option><option value="2">2×</option>
        </select>`;

    const url = v.videoUrl;
    const isYT    = url.includes('youtube') || url.includes('youtu.be');
    const isDrive = url.includes('drive.google.com');

    if (isYT) {
      const ytId = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
      if (!ytId) return null;
      const src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&playsinline=1`;
      return {
        type: 'youtube',
        html: `<div class="rv-secure-wrap">
          <iframe id="rv-sec-iframe" src="${src}"
            allow="autoplay; encrypted-media"
            sandbox="allow-scripts allow-same-origin allow-presentation"
            referrerpolicy="no-referrer"
            style="width:100%;height:100%;border:none;display:block;"></iframe>
          <div class="rv-player-shield"></div>
          <div class="rv-watermark">${wm}</div>
          ${dimHtml}
          <div class="rv-ctrl-bar">
            <div class="rv-btn-row">
              <button class="rv-ctrl-btn rv-play-btn" title="Play/Pause">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              </button>
              <div class="rv-ctrl-spacer"></div>
              ${speedCtrl}
              ${fsBtn}
            </div>
          </div>
        </div>`,
      };
    }

    if (isDrive) {
      const driveId = url.match(/\/d\/([a-zA-Z0-9_-]+)/)?.[1];
      const src = driveId ? `https://drive.google.com/file/d/${driveId}/preview` : url;
      return {
        type: 'drive',
        html: `<div class="rv-secure-wrap">
          <iframe id="rv-sec-iframe" src="${src}"
            allow="autoplay; encrypted-media"
            allowfullscreen
            style="width:100%;height:100%;border:none;display:block;"></iframe>
          <div class="rv-player-shield"></div>
          <div class="rv-watermark">${wm}</div>
          ${dimHtml}
          <div class="rv-ctrl-bar">
            <div class="rv-btn-row">
              <div class="rv-ctrl-spacer"></div>
              ${fsBtn}
            </div>
          </div>
        </div>`,
      };
    }

    // Native video (direct URL — not YouTube/Drive)
    return {
      type: 'video',
      html: `<div class="rv-secure-wrap">
        <video id="rv-sec-video" autoplay playsinline
          controlsList="nodownload noremoteplayback nofullscreen"
          disablePictureInPicture disableRemotePlayback
          draggable="false"
          oncontextmenu="return false;" ondragstart="return false;"
          style="width:100%;height:100%;display:block;background:#000;-webkit-user-drag:none;"
          src="${url}"></video>
        <div class="rv-player-shield"></div>
        <div class="rv-watermark">${wm}</div>
        ${dimHtml}
        <div class="rv-ctrl-bar">
          <div class="rv-progress-row">
            <div class="rv-progress-track"><div class="rv-progress-fill"></div></div>
            <span class="rv-time-txt">0:00 / 0:00</span>
          </div>
          <div class="rv-btn-row">
            <button class="rv-ctrl-btn rv-play-btn" title="Play/Pause">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <div class="rv-ctrl-spacer"></div>
            ${speedCtrl}
            ${fsBtn}
          </div>
        </div>
      </div>`,
    };
  }

  // ── Play video securely in main panel (paid users only) ──
  async function playVideo(v) {
    const playerEl    = document.getElementById('rv-player');
    const placeholder = document.getElementById('rv-player-placeholder');
    const nowPlaying  = document.getElementById('rv-now-playing');
    const detailsView = document.getElementById('rv-details-view');

    if (detailsView) detailsView.classList.remove('active');

    // Reset global pause hook each time a new video loads
    _rvPauseCurrent = null;

    if (v.videoUrl && v.videoUrl.startsWith('http')) {
      const result = await _rvBuildEmbed(v);
      if (result) {
        if (playerEl) { playerEl.innerHTML = result.html; playerEl.style.display = ''; }
        if (placeholder) placeholder.style.display = 'none';

        const wrapEl = playerEl?.querySelector('.rv-secure-wrap');
        if (wrapEl) {
          if (result.type === 'video') {
            const vid = document.getElementById('rv-sec-video');
            if (vid) _rvWireVideo(vid, wrapEl);
          } else if (result.type === 'youtube') {
            const iframe = document.getElementById('rv-sec-iframe');
            if (iframe) _rvWireYT(iframe, wrapEl);
          } else if (result.type === 'drive') {
            // Google Drive: wire fullscreen + show controls on hover/touch
            const fsBtn = wrapEl.querySelector('.rv-fs-btn');
            fsBtn?.addEventListener('click', e => {
              e.stopPropagation();
              const wrap = document.getElementById('rv-player-wrap');
              if (!document.fullscreenElement) {
                (wrap?.requestFullscreen || wrap?.webkitRequestFullscreen || wrap?.mozRequestFullScreen)?.call(wrap);
              } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen)?.call(document);
              }
            });
            let _ht;
            const showCtrl = () => {
              wrapEl.classList.add('rv-show-ctrl');
              clearTimeout(_ht);
              _ht = setTimeout(() => wrapEl.classList.remove('rv-show-ctrl'), 3000);
            };
            wrapEl.addEventListener('mousemove', showCtrl);
            wrapEl.addEventListener('touchstart', showCtrl, { passive: true });
          }
        }
      }
    } else {
      const embed = `<div class="rv-player-placeholder"><div class="rv-ph-pulse" style="margin-bottom:.5rem;">${v.icon || '🎬'}</div><p>Recording not yet available. Check back soon.</p></div>`;
      if (playerEl) { playerEl.innerHTML = embed; playerEl.style.display = ''; }
      if (placeholder) placeholder.style.display = 'none';
    }

    // Update "Now Playing" info
    if (nowPlaying) {
      document.getElementById('rv-np-title').textContent = v.title;
      const meta = document.getElementById('rv-np-meta');
      const parts = [];
      if (v.courseTitle) parts.push(`<span class="rv-np-badge">📚 ${v.courseTitle}</span>`);
      if (v.duration !== '—') parts.push(`<span>⏱ ${v.duration}</span>`);
      if (v.isNew) parts.push(`<span class="rv-np-badge" style="background:linear-gradient(135deg,#7c5cfc,#3d6bff);color:#fff;border:none;">New</span>`);
      meta.innerHTML = parts.join('');
      nowPlaying.style.display = '';
    }

    // Highlight active item in playlist
    _activeVideoId = v.id;
    document.querySelectorAll('.rv-pi').forEach(el => el.classList.remove('active'));
    const activeItem = document.getElementById('pi-' + v.id);
    if (activeItem) {
      activeItem.classList.add('active');
      activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Scroll main panel into view on mobile
    document.getElementById('rv-player-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Load recordings from live_recordings table (DB only) ──
  async function loadVideos() {
    showSkeleton();
    try {
      // Wait for supabase to init if needed
      if (!window.supabaseConfig?.client) {
        await new Promise(r => setTimeout(r, 800));
      }
      if (!window.supabaseConfig?.client) throw new Error('Database not ready');

      const client = window.supabaseConfig.client;

      // Single query — joins course (via course_id) AND batch (via batch_id → course_batches → courses)
      // This gives real titles for ALL recordings, even those linked only via a batch
      let data = null;
      let error = null;

      try {
        const result = await client
          .from('live_recordings')
          .select(`
            id, title, provider_name, access_level, course_id, batch_id,
            created_at, base_amount, gst_percentage, total_amount,
            direct_course:course_id(id, title,
              course_categories(name),
              course_pricing(id, sale_price, list_price, is_active)
            ),
            batch:batch_id(batch_name, course_id,
              batch_course:course_id(id, title,
                course_categories(name),
                course_pricing(id, sale_price, list_price, is_active)
              )
            )
          `)
          .eq('is_published', true)
          .order('created_at', { ascending: false });
        data = result.data;
        error = result.error;
      } catch (e) {
        error = e;
      }

      if (error) {
        console.warn('Recording list query failed, retrying with simple record fetch:', error);
        const fallback = await client
          .from('live_recordings')
          .select('id, title, provider_name, access_level, course_id, batch_id, created_at, base_amount, gst_percentage, total_amount')
          .eq('is_published', true)
          .order('created_at', { ascending: false });
        if (fallback.error) throw fallback.error;
        data = fallback.data;
      }

      if (!data || !data.length) {
        const pl = document.getElementById('rv-playlist');
        const countEl = document.getElementById('rv-total-count');
        if (countEl) countEl.textContent = '0 sessions';
        if (pl) pl.innerHTML = `<div class="rv-empty"><div class="rv-empty-icon">🎬</div><p>No published recordings yet</p><p style="font-size:.82rem;">Sessions will appear here after live classes or once recordings are published.</p></div>`;
        return;
      }

      allVideos = data.map(r => {
        // Priority: direct course → course via batch → batch name as label
        const directCourse = r.direct_course || null;
        const batch        = r.batch || null;
        const batchCourse  = batch?.batch_course || null;
        const course       = directCourse || batchCourse || null;

        const courseTitle  = directCourse?.title || batchCourse?.title || batch?.batch_name || '';
        const categoryName = course?.course_categories?.name || '';
        const groupLabel   = courseTitle || categoryName;
        const filterKey    = groupLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'other';

        // Effective course ID for enrollment checks and pricing
        const effectiveCourseId = r.course_id || batch?.course_id || null;

        // Resolve price: recording-level base_amount → course pricing → null
        const activePricing = (course?.course_pricing || []).find(p => p.is_active);
        const basePrice = r.base_amount ?? activePricing?.sale_price ?? activePricing?.list_price ?? null;
        const gstPct = r.gst_percentage ?? 18;
        const totalPrice = r.total_amount ?? (basePrice != null ? Math.round(basePrice * (1 + gstPct / 100)) : null);

        const { icon, gradient } = videoMeta(r.provider_name);
        return {
          id: r.id,
          title: r.title || 'Session Recording',
          courseTitle,
          categoryName,
          groupLabel,
          filterKey,
          duration: r.duration_minutes ? r.duration_minutes + ' min' : '—',
          icon,
          gradient,
          isNew: (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 3600 * 1000,
          tags: groupLabel ? [groupLabel] : [],
          videoUrl: null,
          courseId: effectiveCourseId,
          thumbnail: r.thumbnail_url || null,
          accessLevel: r.access_level || 'paid',
          _access: null,
          basePrice,
          gstPct,
          totalPrice,
          // Keep pricing ID for enrollment upsert (from active pricing row)
          _pricingId: activePricing?.id || null,
        };
      });

      renderPlaylist();
      checkUserAccess(); // async: confirms access badges for logged-in users
    } catch(e) {
      console.error('loadVideos error:', e);
      const pl = document.getElementById('rv-playlist');
      const countEl = document.getElementById('rv-total-count');
      if (countEl) countEl.textContent = 'Error';
      if (pl) pl.innerHTML = `<div class="rv-empty"><div class="rv-empty-icon">⚠️</div><p>Could not load recordings</p><p style="font-size:.8rem;"><a href="" style="color:var(--v1);">Refresh</a> to try again.</p></div>`;
    }
  }

  // Init
  document.addEventListener('DOMContentLoaded', loadVideos);
  </script>
