<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Recorded Sessions — SkillUpNow</title>
  <meta name="description" content="Watch recorded live sessions at your own pace. Premium soft-skills training from India's top coaches.">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Hero ── */
    .rv-hero {
      padding: 7rem 5vw 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .rv-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(124,92,252,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .rv-hero-tag {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .3rem .95rem;
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 50px;
      font-size: .72rem;
      font-weight: 700;
      color: #a855f7;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      animation: fadeUp .5s ease both;
    }
    .rv-hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 5.5vw, 4.5rem);
      font-weight: 700;
      color: var(--txt);
      line-height: 1.05;
      margin-bottom: 1.1rem;
      animation: fadeUp .6s .1s ease both;
      text-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }
    .rv-hero p {
      font-size: 1.08rem;
      color: var(--txt3);
      max-width: 560px;
      margin: 0 auto 2.5rem;
      line-height: 1.75;
      animation: fadeUp .6s .2s ease both;
      text-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    /* ── Prevent drag / selection of content while player is active ── */
    #rv-player iframe,
    #rv-player video {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #rv-player { -webkit-user-select: none; user-select: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Access-checking spinner ── */
    @keyframes rvSpin { to { rotate: 1turn; } }
    #rv-access-checking {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9990;
      background: rgba(13,11,26,.92);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(124,92,252,.35);
      border-radius: 50px;
      padding: .75rem 1.6rem;
      display: flex; align-items: center; gap: .6rem;
      color: #e9d5ff; font-size: .85rem; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease;
    }
    #rv-access-checking.active { opacity: 1; }
    #rv-access-checking .rv-spin {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(124,92,252,.3);
      border-top-color: #7c5cfc;
      border-radius: 50%;
      animation: rvSpin .65s linear infinite;
      flex-shrink: 0;
    }

    /* ── Two-panel layout ── */
    .rv-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 5vw 5rem;
      align-items: start;
    }

    /* ── Main panel (player) ── */
    .rv-main {
      padding-right: 1.5rem;
      min-width: 0;
    }
    .rv-player-wrap {
      background: #0d0b1a;
      border: 1.5px solid rgba(124,92,252,.22);
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16/9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    :root[data-theme="light"] .rv-player-wrap { background: rgba(255,255,255,.9); border-color: rgba(124,92,252,.14); }
    .rv-player-wrap iframe, .rv-player-wrap video {
      width: 100%; height: 100%; border: none; pointer-events: auto;
    }
    .rv-player-wrap video::-webkit-media-controls-download-button { display: none !important; }
    .rv-player-wrap video::-webkit-media-controls-picture-in-picture-button { display: none !important; }
    .rv-player-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; color: var(--txt4); text-align: center; padding: 2rem;
      width: 100%;
    }
    .rv-player-placeholder .ph-icon { font-size: 3.5rem; opacity: .5; }
    .rv-player-placeholder p { font-size: .9rem; line-height: 1.6; color: var(--txt3); text-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    /* ── Video details panel (shown before playing) — fully centered ── */
    #rv-details-view {
      display: none;
      width: 100%; height: 100%;
      padding: 2.5rem 3rem;
      box-sizing: border-box;
      overflow-y: auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.1rem;
      background: linear-gradient(160deg, rgba(124,92,252,.07) 0%, rgba(61,107,255,.04) 100%);
      position: relative;
    }
    #rv-details-view::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 55% 45% at 50% 20%, rgba(124,92,252,.12), transparent 65%);
      pointer-events: none;
    }
    #rv-details-view > * { position: relative; z-index: 1; }
    .rv-dv-meta { justify-content: center; }
    .rv-dv-play-btn { margin: 0 auto; }
    #rv-details-view.active { display: flex; }
    .rv-dv-course-tag {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(124,92,252,.12); border: 1px solid rgba(124,92,252,.28);
      border-radius: 50px; padding: .28rem 1rem;
      font-size: .72rem; font-weight: 700; color: var(--v1);
      width: fit-content; margin: 0 auto;
    }
    .rv-dv-title {
      font-size: clamp(1.15rem, 2.5vw, 1.5rem); font-weight: 800; color: var(--txt);
      line-height: 1.28; margin: 0; max-width: 480px;
    }
    /* ── Session detail chips (duration, date, sessions) ── */
    .rv-dv-detail-chips {
      display: flex; flex-wrap: wrap; gap: .55rem;
      justify-content: center; align-items: center;
    }
    .rv-dv-chip {
      display: inline-flex; align-items: center; gap: .35rem;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 50px; padding: .28rem .85rem;
      font-size: .74rem; font-weight: 600; color: var(--txt2);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    :root[data-theme="light"] .rv-dv-chip {
      background: rgba(124,92,252,.06); border-color: rgba(124,92,252,.18); color: var(--txt2);
    }
    .rv-dv-chip svg { flex-shrink: 0; color: var(--v1); }
    .rv-dv-meta {
      display: flex; flex-wrap: wrap; gap: .5rem .9rem;
      font-size: .78rem; color: var(--txt4); justify-content: center;
    }
    .rv-dv-meta span { display: inline-flex; align-items: center; gap: .3rem; }
    .rv-dv-price-row {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      justify-content: center;
    }
    .rv-dv-price {
      font-size: 1.1rem; font-weight: 800; color: var(--txt);
    }
    .rv-dv-badge-free {
      display: inline-flex; align-items: center; gap: .3rem;
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3);
      border-radius: 50px; padding: .2rem .7rem;
      font-size: .72rem; font-weight: 700; color: #4ade80;
    }
    .rv-dv-badge-paid {
      display: inline-flex; align-items: center; gap: .3rem;
      background: rgba(249,115,22,.08); border: 1px solid rgba(249,115,22,.25);
      border-radius: 50px; padding: .2rem .7rem;
      font-size: .72rem; font-weight: 700; color: #fb923c;
    }
    /* ── Play button — centered, prominent ── */
    .rv-dv-play-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .65rem;
      background: linear-gradient(135deg, #7c5cfc 0%, #3d6bff 60%, #7c5cfc 100%);
      background-size: 200% 100%;
      color: #fff; border: none; border-radius: 50px;
      padding: .9rem 2.5rem; font-size: 1rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 10px 32px rgba(124,92,252,.5), 0 0 0 4px rgba(124,92,252,.12);
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s;
      margin: .35rem auto 0;
      width: fit-content;
      min-width: 180px;
      position: relative; overflow: hidden;
    }
    .rv-dv-play-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.2) 50%, transparent 70%);
      transform: translateX(-130%); transition: transform .5s ease;
    }
    .rv-dv-play-btn:hover::before { transform: translateX(130%); }
    .rv-dv-play-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 16px 44px rgba(124,92,252,.65), 0 0 0 6px rgba(124,92,252,.14);
    }
    .rv-dv-play-btn svg { flex-shrink: 0; width: 18px; height: 18px; }

    /* ── Sidebar courses-list header (distinct from playlist items) ── */
    .rv-courses-list-hdr {
      padding: .6rem 1.25rem .5rem;
      background: rgba(124,92,252,.05);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .rv-courses-list-label {
      font-size: .64rem; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--txt3);
    }
    .rv-now-playing {
      padding: 1.25rem .25rem .75rem;
    }
    .rv-np-title {
      font-size: 1.18rem; font-weight: 800; color: var(--txt); line-height: 1.35; margin-bottom: .5rem;
    }
    .rv-np-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.2rem;
      font-size: .78rem; color: var(--txt4);
    }
    .rv-np-badge {
      display: inline-flex; align-items: center; gap: .3rem;
      background: rgba(124,92,252,.1); border: 1px solid rgba(124,92,252,.22);
      border-radius: 50px; padding: .2rem .65rem;
      font-size: .7rem; font-weight: 700; color: var(--v1);
    }

    /* ── Sidebar (playlist) ── */
    .rv-sidebar {
      position: sticky;
      top: 90px;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      max-height: calc(100vh - 110px);
      display: flex;
      flex-direction: column;
    }
    .rv-sidebar-header {
      padding: 1.1rem 1.25rem .85rem;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .rv-sidebar-header h3 {
      font-size: .92rem; font-weight: 800; color: var(--txt); margin: 0;
    }
    .rv-sidebar-count {
      font-size: .72rem; color: var(--txt4); font-weight: 600;
      background: rgba(124,92,252,.08); border: 1px solid rgba(124,92,252,.18);
      border-radius: 50px; padding: .15rem .6rem;
    }
    .rv-sidebar-search {
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }
    .rv-sidebar-search svg {
      position: absolute; left: 1.6rem; top: 50%; transform: translateY(-50%);
      color: var(--txt4); pointer-events: none;
    }
    .rv-sidebar-search input {
      width: 100%; padding: .55rem .75rem .55rem 2.4rem;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 50px; color: var(--txt); font-size: .82rem;
      font-family: inherit; outline: none;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    .rv-sidebar-search input:focus { border-color: var(--v1); }
    .rv-playlist {
      overflow-y: auto;
      flex: 1;
    }
    .rv-playlist::-webkit-scrollbar { width: 4px; }
    .rv-playlist::-webkit-scrollbar-track { background: transparent; }
    .rv-playlist::-webkit-scrollbar-thumb { background: rgba(124,92,252,.25); border-radius: 2px; }

    /* Course group */
    .rv-course-group { border-bottom: 1px solid var(--border); }
    .rv-course-header {
      display: flex; align-items: center; gap: .6rem;
      padding: .85rem 1.1rem; cursor: pointer;
      transition: background .18s;
    }
    .rv-course-header:hover { background: rgba(124,92,252,.06); }
    .rv-ch-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.45), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.02)),
        linear-gradient(135deg,var(--v1),var(--v2));
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; flex-shrink: 0;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 20px rgba(124,92,252,.18);
      animation: rvCourseOrb 5.4s ease-in-out infinite;
    }
    .rv-ch-icon::before {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.16);
      opacity: .9;
    }
    .rv-ch-icon::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      top: -7px;
      right: -5px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.55), transparent 72%);
      opacity: .75;
    }
    .rv-ch-glyph {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .98rem;
      filter: drop-shadow(0 4px 10px rgba(21,16,65,.22));
      animation: rvGlyphFloat 3.6s ease-in-out infinite;
    }
    .rv-ch-info { flex: 1; min-width: 0; }
    .rv-ch-name {
      font-size: .82rem; font-weight: 700; color: var(--txt);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rv-ch-count { font-size: .69rem; color: var(--txt4); margin-top: .08rem; }
    .rv-ch-chevron {
      flex-shrink: 0; color: var(--txt4);
      transition: transform .22s;
    }
    .rv-course-group.open .rv-ch-chevron { transform: rotate(180deg); }
    .rv-course-videos { display: none; }
    .rv-course-group.open .rv-course-videos { display: block; }

    /* Playlist item */
    .rv-pi {
      display: flex; align-items: center; gap: .7rem;
      padding: .62rem 1.1rem .62rem 1.6rem;
      cursor: pointer; transition: background .18s;
      border-left: 3px solid transparent;
    }
    .rv-pi:hover { background: rgba(124,92,252,.07); border-left-color: rgba(124,92,252,.25); }
    .rv-pi.active { background: rgba(124,92,252,.1); border-left-color: var(--v1); }
    .rv-pi-num {
      width: 20px; font-size: .72rem; color: var(--txt4); font-weight: 600;
      text-align: right; flex-shrink: 0;
    }
    .rv-pi-thumb {
      width: 48px; height: 32px; border-radius: 6px;
      background:
        radial-gradient(circle at 26% 24%, rgba(255,255,255,.28), transparent 36%),
        linear-gradient(135deg,var(--v1),var(--v2));
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; flex-shrink: 0; position: relative; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    }
    .rv-pi-thumb::after {
      content: '';
      position: absolute;
      inset: auto -10px -12px auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.25), transparent 72%);
    }
    .rv-pi-thumb img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
    .rv-pi-body { flex: 1; min-width: 0; }
    .rv-pi-title {
      font-size: .78rem; font-weight: 700; color: var(--txt);
      line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rv-pi-meta { font-size: .66rem; color: var(--txt4); margin-top: .15rem; }
    .rv-pi-lock {
      flex-shrink: 0; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; color: var(--txt4);
    }
    .rv-pi-lock.unlocked { color: #4ade80; }

    /* Skeleton for playlist */
    .rv-pl-skeleton { padding: .6rem 1.1rem; display: flex; gap: .7rem; align-items: center; }
    .rv-skel-thumb { width: 48px; height: 32px; border-radius: 6px; background: var(--panel2); flex-shrink: 0; }
    .rv-skel-body { flex: 1; display: flex; flex-direction: column; gap: .35rem; }
    .rv-skel-line { height: 10px; background: var(--panel2); border-radius: 4px; }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .rv-skel-thumb, .rv-skel-line {
      background-image: linear-gradient(90deg,var(--panel2) 25%,rgba(124,92,252,.07) 50%,var(--panel2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    /* Player placeholder pulse */
    .rv-ph-pulse {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(124,92,252,.12);
      display: flex; align-items: center; justify-content: center;
      animation: phPulse 2s ease-in-out infinite;
    }
    @keyframes phPulse { 0%,100%{transform:scale(1);opacity:.7;} 50%{transform:scale(1.08);opacity:1;} }
    @keyframes rvCourseOrb {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 20px rgba(124,92,252,.18); }
      50% { transform: translateY(-2px) scale(1.04); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 14px 24px rgba(124,92,252,.28); }
    }
    @keyframes rvGlyphFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-1px) scale(1.06); }
    }

    /* Empty / error state */
    .rv-empty {
      padding: 3rem 1.5rem; text-align: center; color: var(--txt4);
    }
    .rv-empty-icon { font-size: 2.5rem; margin-bottom: .75rem; opacity: .6; }

    /* ── Responsive (tablet) ── */
    @media (max-width: 900px) {
      .rv-layout { grid-template-columns: 1fr; padding: 0 4vw 4rem; }
      .rv-main { padding-right: 0; }
      .rv-sidebar {
        position: static; max-height: 60vh;
        margin-top: 1.5rem;
        border-radius: 16px;
      }
    }

    /* ── Mobile-only complete redesign ── */
    @media (max-width: 640px) {
      /* Hero — compact */
      .rv-hero {
        padding: 5rem 4vw 1.5rem;
      }
      .rv-hero::before {
        background:
          radial-gradient(ellipse 78% 56% at 50% 0%, rgba(124,92,252,0.22) 0%, transparent 72%),
          radial-gradient(circle at 15% 20%, rgba(61,107,255,.1), transparent 28%);
      }
      .rv-hero-tag { font-size: .74rem; padding: .38rem .95rem; margin-bottom: 1rem; }
      .rv-hero h1 { font-size: clamp(2rem, 9vw, 2.7rem); line-height: 1.02; margin-bottom: .8rem; text-shadow: 0 12px 24px rgba(0,0,0,0.12); }
      .rv-hero p  { font-size: .94rem; line-height: 1.72; margin-bottom: 1.7rem; max-width: 32ch; text-shadow: 0 6px 16px rgba(0,0,0,0.08); }

      /* Layout: full bleed, tighter padding */
      .rv-layout {
        padding: 0 0 3rem;
        gap: 0;
      }

      /* Player: full bleed on mobile */
      .rv-player-wrap {
        border-radius: 0 0 24px 24px;
        border-left: none;
        border-right: none;
        border-top: none;
        margin: 0 .9rem;
        overflow: hidden;
        box-shadow: 0 22px 40px rgba(24,17,64,.16);
      }
      .rv-main { padding-right: 0; }
      .rv-player-placeholder { padding: 1.8rem 1.25rem 2.2rem; }
      .rv-player-placeholder p { font-size: .88rem; max-width: 24ch; }
      .rv-ph-pulse {
        width: 92px;
        height: 92px;
        background:
          radial-gradient(circle at 30% 30%, rgba(255,255,255,.28), transparent 35%),
          linear-gradient(135deg, rgba(124,92,252,.22), rgba(61,107,255,.12));
        box-shadow: 0 18px 34px rgba(124,92,252,.16);
      }

      /* Now-playing section */
      .rv-now-playing { padding: 1.1rem 1.1rem .2rem; }
      .rv-np-title { font-size: 1.16rem; }
      .rv-np-meta  { font-size: .8rem; gap: .45rem .75rem; }
      .rv-np-badge { padding: .22rem .62rem; font-size: .69rem; }

      /* Sidebar: full-width tab-style */
      .rv-sidebar {
        position: static;
        max-height: none;
        border-radius: 24px;
        border: 1px solid rgba(124,92,252,.14);
        margin: 1rem .9rem 0;
        background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(248,246,255,.92));
        box-shadow: 0 24px 46px rgba(21,16,65,.08);
        overflow: visible;
      }
      :root[data-theme="dark"] .rv-sidebar {
        background: linear-gradient(180deg, rgba(17,13,36,.96), rgba(14,10,30,.94));
        box-shadow: 0 24px 46px rgba(0,0,0,.28);
      }
      .rv-sidebar-header {
        padding: 1rem 1rem .8rem;
        position: sticky; top: 0;
        background: transparent;
        z-index: 10;
        align-items: flex-start;
      }
      .rv-sidebar-header h3 { font-size: 1.18rem; line-height: 1.2; }
      .rv-sidebar-count { font-size: .73rem; padding: .3rem .72rem; }
      .rv-sidebar-search { padding: 0 1rem .95rem; }
      .rv-sidebar-search svg { left: 1.7rem; }
      .rv-sidebar-search input {
        padding: .82rem .9rem .82rem 2.55rem;
        font-size: .84rem;
        border-radius: 16px;
        background: rgba(255,255,255,.76);
      }
      :root[data-theme="dark"] .rv-sidebar-search input { background: rgba(255,255,255,.04); }

      /* Playlist: show all items (no max-height), scroll the page */
      .rv-playlist {
        overflow-y: visible;
        max-height: none;
        display: grid;
        gap: .85rem;
        padding: 0 .95rem 1rem;
      }
      .rv-course-group {
        border: 1px solid rgba(124,92,252,.12);
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(124,92,252,.06), rgba(124,92,252,.02));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
      }
      :root[data-theme="dark"] .rv-course-group {
        background: linear-gradient(180deg, rgba(124,92,252,.08), rgba(124,92,252,.03));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      }

      /* Playlist items: bigger touch targets */
      .rv-course-header { padding: .95rem 1rem; gap: .78rem; }
      .rv-ch-icon { width: 44px; height: 44px; border-radius: 14px; font-size: 1.06rem; }
      .rv-ch-name { font-size: .98rem; white-space: normal; line-height: 1.25; }
      .rv-ch-count { font-size: .76rem; margin-top: .16rem; }
      .rv-course-videos { padding: 0 .9rem .9rem; }
      .rv-course-group.open .rv-course-videos {
        display: grid;
        grid-template-columns: 1fr;
        gap: .75rem;
      }
      .rv-pi {
        flex-direction: row;
        align-items: flex-start;
        gap: .82rem;
        padding: .92rem;

        border-color: rgba(124,92,252,.28);

      }
      .rv-pi-num {
        width: 28px;
        height: 28px;
        border-radius: 999px;

        align-items: center;

        align-self: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(124,92,252,.08);
        flex-shrink: 0;
      }

      /* Details panel — fits screen */
      #rv-details-view { padding: 1.35rem 1.1rem 1.4rem; }
      .rv-dv-course-tag { font-size: .76rem; padding: .35rem .86rem; }
      .rv-dv-title { font-size: 1.42rem; line-height: 1.2; }
      .rv-dv-meta { font-size: .8rem; }
      .rv-dv-price { font-size: 1.24rem; }
      .rv-dv-play-btn { padding: .78rem 1.5rem; font-size: .92rem; width: 100%; justify-content: center; }

      /* Gate payment modal */
      #rv-gate-overlay .ec-box {
        padding: 1.5rem 1rem;
        max-height: 90vh;
        overflow-y: auto;
        margin: 5vh 1rem;
        border-radius: 16px;
      }
    }

    /* Extra-small phones */
    @media (max-width: 380px) {
      .rv-hero h1 { font-size: 1.82rem; }
      .rv-course-group.open .rv-course-videos { grid-template-columns: 1fr; }
      .rv-pi-thumb { height: 66px; }
    }

    /* ── Secure Player ── */
    .rv-secure-wrap {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      isolation: isolate;
      -webkit-user-select: none;
      user-select: none;
    }
    .rv-player-shield {
      position: absolute;
      inset: 0; z-index: 2;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .rv-watermark {
      position: absolute;
      inset: 0; z-index: 3;
      pointer-events: none;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .rv-watermark-text {
      position: absolute;
      font-size: .68rem;
      font-weight: 600;
      color: rgba(255,255,255,.09);
      white-space: nowrap;
      transform: rotate(-28deg);
      letter-spacing: .03em;
    }
    :root[data-theme="light"] .rv-watermark-text { color: rgba(0,0,0,.07); }
    .rv-dim-overlay {
      position: absolute;
      inset: 0; z-index: 50;
      background: rgba(0,0,0,.97);
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: .6rem;
      color: rgba(255,255,255,.3);
      font-size: .82rem; font-weight: 600;
      text-align: center; padding: 1rem;
      -webkit-user-select: none; user-select: none;
    }
    .rv-dim-overlay.active { display: flex; }
    .rv-ctrl-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
      padding: 1.8rem .8rem .55rem;
      display: flex; flex-direction: column; gap: .3rem;
      opacity: 0; transition: opacity .22s ease;
      pointer-events: none;
    }
    .rv-secure-wrap:hover .rv-ctrl-bar,
    .rv-secure-wrap.rv-show-ctrl .rv-ctrl-bar {
      opacity: 1; pointer-events: auto;
    }
    .rv-progress-row { display: flex; align-items: center; gap: .5rem; }
    .rv-progress-track {
      flex: 1; height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .rv-progress-fill {
      height: 100%;
      background: linear-gradient(90deg,#7c5cfc,#3d6bff);
      border-radius: 2px; width: 0%;
      transition: width .08s linear;
      pointer-events: none;
    }
    .rv-time-txt {
      font-size: .67rem; color: rgba(255,255,255,.6);
      font-weight: 500; white-space: nowrap;
      min-width: 76px; text-align: right;
    }
    .rv-btn-row { display: flex; align-items: center; gap: .25rem; }
    .rv-ctrl-btn {
      background: none; border: none; color: #fff;
      cursor: pointer; padding: .28rem .4rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; transition: background .15s;
      font-family: inherit; font-size: .78rem; font-weight: 600; line-height: 1;
    }
    .rv-ctrl-btn:hover { background: rgba(255,255,255,.15); }
    .rv-ctrl-spacer { flex: 1; }
    .rv-speed-sel {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px; color: #fff;
      font-size: .7rem; font-weight: 600;
      padding: .16rem .5rem;
      cursor: pointer; font-family: inherit; outline: none;
    }
    .rv-speed-sel option { background: #1a1a2e; color: #fff; }
    /* Fullscreen on player wrap */
    .rv-player-wrap:fullscreen,
    .rv-player-wrap:-webkit-full-screen,
    .rv-player-wrap:-moz-full-screen {
      border-radius: 0 !important;
      border: none !important;
      aspect-ratio: unset !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    .rv-player-wrap:fullscreen #rv-player,
    .rv-player-wrap:-webkit-full-screen #rv-player,
    .rv-player-wrap:-moz-full-screen #rv-player {
      height: 100% !important;
    }
    .rv-player-wrap:fullscreen .rv-secure-wrap,
    .rv-player-wrap:-webkit-full-screen .rv-secure-wrap,
    .rv-player-wrap:-moz-full-screen .rv-secure-wrap {
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div class="mesh-bg"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <nav></nav>

  <!-- Hero -->
  <section class="rv-hero">
    <div class="rv-hero-tag">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Recorded Sessions
    </div>
    <h1>Watch. Learn. <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Grow.</span></h1>
    <p>Every live session, recorded for you. Premium coaching at your own pace.</p>
  </section>

  <!-- Two-panel layout -->
  <div class="rv-layout">

    <!-- Main: Player + Now Playing -->
    <div class="rv-main">
      <div class="rv-player-wrap" id="rv-player-wrap">
        <div class="rv-player-placeholder" id="rv-player-placeholder">
          <div class="rv-ph-pulse">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(124,92,252,.7)" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
          <p>Select a session from the playlist to start watching</p>
        </div>
        <!-- Details panel: shown after clicking playlist item, before play -->
        <div id="rv-details-view">
          <div class="rv-dv-course-tag" id="rv-dv-course-tag"></div>
          <h2 class="rv-dv-title" id="rv-dv-title"></h2>
          <div class="rv-dv-detail-chips" id="rv-dv-detail-chips"></div>
          <div class="rv-dv-meta" id="rv-dv-meta"></div>
          <div class="rv-dv-price-row" id="rv-dv-price-row"></div>
          <button type="button" class="rv-dv-play-btn" id="rv-dv-play-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Play Video
          </button>
        </div>
        <div id="rv-player" style="display:none;width:100%;height:100%;"></div>
      </div>
      <div class="rv-now-playing" id="rv-now-playing" style="display:none;">
        <div class="rv-np-title" id="rv-np-title">Session Title</div>
        <div class="rv-np-meta" id="rv-np-meta"></div>
      </div>
    </div>

    <!-- Sidebar: Playlist -->
    <div class="rv-sidebar">
      <div class="rv-sidebar-header">
        <h3>Course Playlist</h3>
        <span class="rv-sidebar-count" id="rv-total-count">Loading…</span>
      </div>
      <div class="rv-courses-list-hdr">
        <span class="rv-courses-list-label">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 10h16M4 14h10"/></svg>
          Sessions
        </span>
      </div>
      <div class="rv-sidebar-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="rv-search-input" placeholder="Search sessions…" oninput="filterPlaylist()">
      </div>
      <div class="rv-playlist" id="rv-playlist">
        <!-- populated by JS -->
      </div>
    </div>

  </div>

  <!-- Access-checking overlay -->
  <div id="rv-access-checking">
    <div class="rv-spin"></div>
    Checking access…
  </div>

  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="../js/razorpay-loader.js"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/profile-nav.js"></script>

  <script>
  /* ══════════════════════════════════════════════════════════════
     Recording Videos — playlist layout, per-video access control
     • List is visible to everyone (no login needed)
     • Clicking a video → checks login → checks payment → plays in main panel
     • Paid users: play video with security restrictions
     • Unpaid users: show Razorpay payment prompt
     ══════════════════════════════════════════════════════════════ */

  // ── Global "pause current video" hook — set by playVideo() ──
  let _rvPauseCurrent = null;

  // ── Flash the dim overlay briefly (screenshot attempt deterrent) ──
  function _flashDimOverlay() {
    const d = document.querySelector('.rv-dim-overlay');
    if (!d) return;
    d.classList.add('active');
    setTimeout(() => d.classList.remove('active'), 2500);
  }

  // ── Enhanced screen-capture blocking ──
  function blockScreenCapture() {
    const playerActive = () => document.getElementById('rv-player')?.style.display !== 'none';

    // Right-click prevention on the whole document when player is active
    document.addEventListener('contextmenu', e => {
      if (playerActive()) { e.preventDefault(); e.stopPropagation(); return false; }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (!playerActive()) return;
      const k = e.key?.toLowerCase();
      // Screenshot / print screen
      if (e.key === 'PrintScreen' || e.key === 'Snapshot') {
        e.preventDefault();
        navigator.clipboard?.writeText?.('').catch(() => {});
        _flashDimOverlay();
        return;
      }
      if (e.key === 'F12') { e.preventDefault(); return; }
      if ((e.ctrlKey || e.metaKey) && ['p','s','u'].includes(k)) { e.preventDefault(); return; }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','c','j','k','m','s'].includes(k)) { e.preventDefault(); return; }
      // Windows Snipping Tool (Win+Shift+S)
      if (e.metaKey && e.shiftKey && ['s','4','5'].includes(k)) { e.preventDefault(); _flashDimOverlay(); }
      // Mac screenshot (Cmd+Shift+3/4/5)
      if (e.metaKey && e.shiftKey && ['3','4','5'].includes(e.key)) { e.preventDefault(); _flashDimOverlay(); }
    });

    // Before print (Ctrl+P or browser print)
    window.addEventListener('beforeprint', () => { if (playerActive()) _flashDimOverlay(); });

    // Visibility API — dim + pause when tab is hidden
    document.addEventListener('visibilitychange', () => {
      if (!playerActive()) return;
      const d = document.querySelector('.rv-dim-overlay');
      if (document.hidden) {
        document.querySelector('#rv-player video')?.pause();
        _rvPauseCurrent?.();
        if (d) d.classList.add('active');
      } else {
        if (d) d.classList.remove('active');
      }
    });

    // Window blur — dim + pause when user switches app / screen-records
    // Skip if focus moved INTO the player iframe (clicking inside Drive/YT iframe
    // causes the parent window to blur — that is normal interaction, not a threat)
    window.addEventListener('blur', () => {
      if (!playerActive()) return;
      if (document.querySelector('#rv-player iframe')) return;
      document.querySelector('#rv-player video')?.pause();
      const d = document.querySelector('.rv-dim-overlay');
      if (d) d.classList.add('active');
    });
    window.addEventListener('focus', () => {
      const d = document.querySelector('.rv-dim-overlay');
      if (d) d.classList.remove('active');
    });
  }
  blockScreenCapture();

  let allVideos = [];
  let _activeVideoId = null;

  // ── Provider → gradient + icon ──
  function videoMeta(provider) {
    if (provider === 'youtube')      return { icon: '▶', gradient: 'linear-gradient(135deg,#ff4e50,#f9d423)' };
    if (provider === 'google_drive') return { icon: '📁', gradient: 'linear-gradient(135deg,#4285f4,#34a853)' };
    if (provider === 'vimeo')        return { icon: '🎬', gradient: 'linear-gradient(135deg,#1ab7ea,#0075b2)' };
    return { icon: '🎥', gradient: 'linear-gradient(135deg,#7c5cfc,#3d6bff)' };
  }

  // ── Skeleton while loading ──
  function showSkeleton() {
    const pl = document.getElementById('rv-playlist');
    if (!pl) return;
    pl.innerHTML = Array.from({length: 8}, () => `
      <div class="rv-pl-skeleton">
        <div class="rv-skel-thumb"></div>
        <div class="rv-skel-body">
          <div class="rv-skel-line" style="width:80%"></div>
          <div class="rv-skel-line" style="width:50%"></div>
        </div>
      </div>`).join('');
  }

  // ── Category icons ──
  function courseIcon(name) {
    const n = (name||'').toLowerCase();
    if (n.includes('cloud') || n.includes('aws') || n.includes('azure')) return '☁️';
    if (n.includes('ai') || n.includes('machine') || n.includes('ml')) return '🤖';
    if (n.includes('cyber') || n.includes('security')) return '🔒';
    if (n.includes('devops') || n.includes('docker') || n.includes('k8s')) return '⚙️';
    if (n.includes('data') || n.includes('analytics')) return '📊';
    if (n.includes('communication') || n.includes('soft')) return '💬';
    if (n.includes('leadership') || n.includes('management')) return '🏆';
    if (n.includes('interview')) return '🎤';
    if (n.includes('business')) return '💼';
    return '📚';
  }

  // ── Render sidebar playlist grouped by course, sorted alphabetically ──
  function courseIcon(name) {
    const n = (name || '').toLowerCase();
    if (n.includes('cloud') || n.includes('aws') || n.includes('azure')) return '<span class="rv-ch-glyph">☁</span>';
    if (n.includes('ai') || n.includes('machine') || n.includes('ml')) return '<span class="rv-ch-glyph">✦</span>';
    if (n.includes('cyber') || n.includes('security')) return '<span class="rv-ch-glyph">🛡</span>';
    if (n.includes('devops') || n.includes('docker') || n.includes('k8s')) return '<span class="rv-ch-glyph">⚙</span>';
    if (n.includes('data') || n.includes('analytics')) return '<span class="rv-ch-glyph">◔</span>';
    if (n.includes('communication') || n.includes('soft')) return '<span class="rv-ch-glyph">◉</span>';
    if (n.includes('leadership') || n.includes('management')) return '<span class="rv-ch-glyph">✧</span>';
    if (n.includes('interview')) return '<span class="rv-ch-glyph">◈</span>';
    if (n.includes('business')) return '<span class="rv-ch-glyph">▣</span>';
    return '<span class="rv-ch-glyph">◌</span>';
  }

  function renderPlaylist() {
    const pl = document.getElementById('rv-playlist');
    const countEl = document.getElementById('rv-total-count');
    if (!pl) return;

    const q = (document.getElementById('rv-search-input')?.value || '').toLowerCase().trim();

    // Filter by search (title, course title, or category name)
    const filtered = q
      ? allVideos.filter(v =>
          v.title.toLowerCase().includes(q) ||
          (v.groupLabel||'').toLowerCase().includes(q) ||
          (v.categoryName||'').toLowerCase().includes(q))
      : allVideos;

    if (countEl) countEl.textContent = filtered.length + ' session' + (filtered.length !== 1 ? 's' : '');

    if (!filtered.length) {
      pl.innerHTML = `<div class="rv-empty"><div class="rv-empty-icon">🎬</div><p>No sessions found</p></div>`;
      return;
    }

    // Group by course / category; recordings with no course go into 'Other'
    const groups = {};
    filtered.forEach(v => {
      const label = v.groupLabel || 'Other';
      const key   = v.filterKey  || 'other';
      if (!groups[key]) groups[key] = { name: label, key, videos: [] };
      groups[key].videos.push(v);
    });

    // Sort videos within each group alphabetically
    Object.values(groups).forEach(g => {
      g.videos.sort((a, b) => a.title.localeCompare(b.title));
    });

    // Sort groups alphabetically
    const sortedGroups = Object.values(groups)
      .sort((a, b) => a.name.localeCompare(b.name));

    pl.innerHTML = sortedGroups.map((g, gi) => {
      const open = true; // all groups open by default
      const icon = courseIcon(g.name);
      const items = g.videos.map((v, i) => {
        const isActive   = v.id === _activeVideoId;
        const isUnlocked = v._access === 'full';
        const isChecking = v._access === null; // session check in progress
        const lockIcon = isUnlocked
          ? `<div class="rv-pi-lock unlocked"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>`
          : `<div class="rv-pi-lock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>`;
        const metaText = isUnlocked ? 'Unlocked'
          : isChecking ? '…'
          : v._access === 'locked' ? 'Login to watch'
          : v._access === 'unpaid'
            ? (v.totalPrice != null ? '₹' + Number(v.totalPrice).toLocaleString('en-IN') : 'Pay to watch')
            : v.totalPrice != null ? '₹' + Number(v.totalPrice).toLocaleString('en-IN') : 'Members only';
        const thumb = v.thumbnail
          ? `<img src="${v.thumbnail}" alt="" onerror="this.style.display='none'">`
          : v.icon;
        return `<div class="rv-pi${isActive ? ' active' : ''}" id="pi-${v.id}" onclick="showVideoDetails('${v.id}')">
          <div class="rv-pi-num">${i + 1}</div>
          <div class="rv-pi-thumb">${thumb}</div>
          <div class="rv-pi-body">
            <div class="rv-pi-title">${v.title}</div>
            <div class="rv-pi-meta">${v.duration !== '—' ? '⏱ ' + v.duration + ' · ' : ''}${metaText}</div>
          </div>
          ${lockIcon}
        </div>`;
      }).join('');

      return `<div class="rv-course-group${open ? ' open' : ''}" id="cg-${g.key}">
        <div class="rv-course-header" onclick="toggleGroup('cg-${g.key}')">
          <div class="rv-ch-icon">${icon}</div>
          <div class="rv-ch-info">
            <div class="rv-ch-name">${g.name}</div>

  // ── Access check: login → enrollment check → fetch URL → play ──
  async function handleWatchClick(id) {
    const v = allVideos.find(x => x.id === id);
    if (!v) return;

    const client = window.supabaseConfig?.client;
    if (!client) { showVideoGate(v, 'noClient'); return; }

    const spinner = document.getElementById('rv-access-checking');
    spinner?.classList.add('active');

    try {
      const { data: { session } } = await client.auth.getSession();
      const user = session?.user;

      // Public video — play for everyone (no login required)
      if (v.accessLevel === 'public') {
        const { data: rec } = await client.from('live_recordings')
          .select('external_url').eq('id', id).single();
        if (rec?.external_url) { v.videoUrl = rec.external_url; playVideo(v); }
        return;
      }

      // Not logged in → show login gate
      if (!user) { showVideoGate(v, 'login'); return; }

      // Check enrollment / admin-granted access
      const hasAccess = await _checkVideoAccess(user.id, v);
      if (hasAccess) {
        const { data: rec } = await client.from('live_recordings')
          .select('external_url').eq('id', id).single();
        if (rec?.external_url) { v.videoUrl = rec.external_url; playVideo(v); }
        else { _showRvToast('Video URL not available. Contact support.', 'error'); }
      } else {
        showVideoGate(v, 'payment');
      }
    } catch(e) {
      console.error('handleWatchClick error:', e);
    } finally {
      spinner?.classList.remove('active');
    }
  }

  // and returns. We ONLY act if a pending video was set before the redirect.

  // ── Bottom toast notification ──
  function _showRvToast(msg, type = 'success') {
    const colors = {
      success: { bg: 'rgba(34,197,94,.18)',   border: 'rgba(34,197,94,.4)',   text: '#4ade80' },
      error:   { bg: 'rgba(239,68,68,.18)',   border: 'rgba(239,68,68,.4)',   text: '#f87171' },
      info:    { bg: 'rgba(124,92,252,.18)',  border: 'rgba(124,92,252,.4)', text: '#a78bfa' },
    };

  // ── Per-video enrollment access check ──
  // Returns true if the user can watch this video:
  //   access_level='public'   → always
  //   access_level='enrolled' → any enrollment exists for the course
  //   access_level='paid'     → enrollment_status IN (active,completed) AND access_status='active'
  async function _checkVideoAccess(userId, v) {
    if (v.accessLevel === 'public') return true;
    if (!v.courseId || !userId) return false;
    const { data } = await window.supabaseConfig.client
      .from('enrollments')
      .select('enrollment_status,access_status')
      .eq('student_user_id', userId)
      .eq('course_id', v.courseId)
      .limit(1);
    const e = data?.[0];
    if (!e) return false;
    if (v.accessLevel === 'enrolled') {
      return ['pending','active','completed'].includes(e.enrollment_status);
    }
    // 'paid' (default)
    return ['active','completed'].includes(e.enrollment_status) && e.access_status === 'active';
  }

  // ── Batch-refresh access badges for all videos ──
  async function checkUserAccess() {
    const client = window.supabaseConfig?.client;
    if (!client) return;
    try {
      const { data: { session } } = await client.auth.getSession();
      const userId = session?.user?.id || null;
      let changed = false;

      if (!userId) {
        // Not logged in — public videos unlocked, everything else locked
        allVideos.forEach(v => {
          const desired = v.accessLevel === 'public' ? 'full' : 'locked';
          if (v._access !== desired) { v._access = desired; changed = true; }
        });
        if (changed) renderPlaylist();
        return;
      }

      // Logged in — batch-fetch enrollments for all video courses
      const courseIds = [...new Set(allVideos.filter(v => v.courseId).map(v => v.courseId))];
      const enrollMap = {};
      if (courseIds.length) {
        const { data: rows } = await client
          .from('enrollments')
          .select('course_id,enrollment_status,access_status')
          .eq('student_user_id', userId)
          .in('course_id', courseIds);
        (rows || []).forEach(e => { enrollMap[e.course_id] = e; });
      }

      allVideos.forEach(v => {
        let desired;
        if (v.accessLevel === 'public') {
          desired = 'full';
        } else if (!v.courseId) {
          desired = 'locked';
        } else {
          const e = enrollMap[v.courseId];
          if (!e) {
            desired = 'unpaid';
          } else if (v.accessLevel === 'enrolled') {
            desired = ['pending','active','completed'].includes(e.enrollment_status) ? 'full' : 'locked';
          } else {
            // 'paid': need active enrollment + active access (admin-approved or payment complete)
            desired = ['active','completed'].includes(e.enrollment_status) && e.access_status === 'active'
              ? 'full' : 'unpaid';
          }
        }
        if (v._access !== desired) { v._access = desired; changed = true; }
      });

      if (changed) renderPlaylist();
    } catch(e) { console.warn('checkUserAccess:', e); }
  }

  // ── Load course pricing for the payment gate ──
  async function loadCoursePricingForGate(v) {
    const loadEl = document.getElementById('rv-pay-loading');
    const optsEl = document.getElementById('rv-pay-options');
    const el = id => document.getElementById(id);

    // Fast path: video already has pricing data pre-fetched during load
    if (v.totalPrice != null && v.totalPrice > 0 && v._pricingId) {
      showPrice(v.totalPrice, v.courseId, v._pricingId);
      return;
    }

    const showPrice = (total, courseId, pricingId) => {
      _gateTotalAmount = total;
      _gatePricingId   = pricingId || null;
      _gateCourse = { id: courseId || null };
      const fmtTotal = total > 0 ? '₹' + Number(total).toLocaleString('en-IN') : 'Contact Us';
      if (el('rv-total-price')) el('rv-total-price').textContent = fmtTotal;
      const payBtn = el('rv-pay-btn');
      if (payBtn && total > 0) payBtn.textContent = 'Pay ₹' + Number(total).toLocaleString('en-IN') + ' via Razorpay';
      if (loadEl) loadEl.style.display = 'none';
      if (optsEl) optsEl.style.display = '';
      el('rv-pay-btn')?.addEventListener('click', _gateInitiatePayment);
    };

    try {
      // ── Priority 1: recording's own total_amount (set by admin in DB) ──
      // Pricing ID will be fetched from course_pricing below if needed
      if (v.totalPrice != null && v.totalPrice > 0 && !v.courseId) {
        showPrice(v.totalPrice, v.courseId, null);
        return;
      }

      // ── Priority 2 + 3: look up course_pricing to get both price AND pricing_id ──
      const courseId = v.courseId || null;
      if (courseId && window.supabaseConfig) {
        const { data } = await window.supabaseConfig.client
          .from('course_pricing')
          .select('id,sale_price,list_price,is_active')
          .eq('course_id', courseId)
          .order('is_active', { ascending: false })
          .limit(1);
        const pricing = data?.[0] || null;
        if (pricing) {
          // Prefer recording-level total_amount if set, else calculate from pricing
          const base = v.basePrice ?? pricing.sale_price ?? pricing.list_price ?? 0;
          const total = v.totalPrice ?? Math.round(base * 1.18);
          showPrice(total, courseId, pricing.id);
          return;
        }
      }

      // ── Fallback: no course pricing — use recording-level price if set ──
      if (v.totalPrice != null && v.totalPrice > 0) {
        showPrice(v.totalPrice, v.courseId, null);
        return;
      }
      if (v.basePrice != null && v.basePrice > 0) {
        const total = Math.round(v.basePrice * 1.18);
        showPrice(total, v.courseId, null);
        return;
      }

      // ── No pricing found ──
      if (loadEl) loadEl.style.display = 'none';
      if (optsEl) {
        optsEl.innerHTML = `<p style="color:var(--txt3);font-size:.85rem;margin-bottom:1rem;">Pricing not available for this session.</p><a href="courses" style="color:#7c5cfc;font-weight:700;">Browse courses to enroll →</a>`;
        optsEl.style.display = '';
      }
    } catch(e) {
      console.warn('Pricing load error:', e);
      if (loadEl) loadEl.style.display = 'none';
      if (optsEl) { optsEl.innerHTML = '<a href="courses" style="color:#7c5cfc;font-weight:700;">Browse courses to enroll →</a>'; optsEl.style.display = ''; }
    }
  }

  async function _gateInitiatePayment() {
    const btn = document.getElementById('rv-pay-btn');
    if (!btn) return;

    // Razorpay requires HTTPS — fail gracefully on file:// protocol
    if (window.location.protocol === 'file:') {
      _showGateError('Payment requires a hosted site (HTTPS). Please access SkillUpNow via its web URL, not a local file.');
      return;
    }

    if (!window.supabaseConfig) return;
    const { data: { session } } = await window.supabaseConfig.client.auth.getSession();
    const user = session?.user;
    if (!user) {
      document.getElementById('rv-access-gate')?.remove();
      if (_gateVideo) window._pendingVideoId = _gateVideo.id;
      window.profileNav?.openLoginModal?.();
      return;
    }
    if (!_gateCourse) { window.location.href = 'courses'; return; }

    const totalAmount = _gateTotalAmount;
    if (!totalAmount || totalAmount <= 0) {
      _showGateError('Could not calculate payment amount. Please try again or contact support.');
      return;
    }

    if (typeof window.Razorpay === 'undefined') {
      _showGateError('Payment gateway failed to load. Please check your internet connection and refresh the page.');
      return;
    }

    btn.disabled = true; btn.textContent = 'Creating order…';

    // Create Razorpay order via Netlify function (required for live mode)
    let rzpOrderId = null;
    try {
      const orderRes = await fetch('/api/create-razorpay-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: Math.round(totalAmount * 100), currency: 'INR' }),
      });
      const orderData = await orderRes.json();
      if (orderRes.ok && orderData.id) {
        rzpOrderId = orderData.id;
      } else {
        throw new Error(orderData.error || 'Order creation failed');
      }
    } catch (orderErr) {
      console.error('Order creation failed:', orderErr);
      btn.disabled = false;
      btn.textContent = 'Pay ₹' + Number(totalAmount).toLocaleString('en-IN') + ' via Razorpay';
      _showGateError('Could not create payment order. Please try again or contact support.');
      return;
    }

    btn.textContent = 'Processing…';
    try {
      const options = {
        key: window.__RZP_KEY_ID || '',
        amount: Math.round(totalAmount * 100),
        currency: 'INR',
        order_id: rzpOrderId,
        name: 'SkillUpNow',
        description: _gateVideo?.title || 'Course Enrollment',
        image: '../icon/logo.png',
        prefill: {
          name: user.user_metadata?.full_name || '',
          email: user.email,
          contact: user.user_metadata?.phone || ''
        },
        notes: { course_id: _gateCourse?.id || '', video_title: _gateVideo?.title || '' },
        theme: { color: '#7c5cfc' },
        modal: {
          ondismiss: () => {
            btn.disabled = false;
            btn.textContent = 'Pay ₹' + Number(totalAmount).toLocaleString('en-IN') + ' via Razorpay';
          }
        },
        handler: async (response) => {
          btn.textContent = 'Processing…';
          try {
            // Upsert enrollment
            const { data: enroll, error: enrollErr } = await window.supabaseConfig.client
              .from('enrollments').upsert({
                student_user_id: user.id, course_id: _gateCourse.id,
                ...(_gatePricingId ? { pricing_id: _gatePricingId } : {}),
                enrollment_status: 'active', access_status: 'active',
                net_amount: totalAmount, paid_amount: totalAmount, due_amount: 0,
              }, { onConflict: 'student_user_id,course_id' }).select().maybeSingle();
            if (enrollErr) console.warn('Enrollment upsert:', enrollErr.message);
            // Record payment (only if enrollment succeeded and we have an enrollment ID)
            if (enroll?.id) {
              const { error: payErr } = await window.supabaseConfig.client.from('payments').insert({
                student_user_id: user.id,
                enrollment_id: enroll.id,
                course_id: _gateCourse.id,
                amount: totalAmount,
                payment_method: 'gateway_link',
                payment_gateway: 'razorpay',
                gateway_order_id: response.razorpay_order_id || null,
                gateway_payment_id: response.razorpay_payment_id || null,
                gateway_signature: response.razorpay_signature || null,
                transaction_reference: response.razorpay_payment_id || null,
                payment_status: 'completed',
                paid_at: new Date().toISOString(),
              });
              if (payErr) console.warn('Payment record:', payErr.message);
            }
          } catch(dbErr) { console.warn('DB record error:', dbErr); }
          _showRvToast('Payment successful! Enjoy your session.', 'success');
          // Unlock all videos in the same course immediately in the UI
          if (_gateVideo?.courseId) {
            allVideos.forEach(v => {
              if (v.courseId === _gateVideo.courseId) v._access = 'full';
            });
            renderPlaylist();
          }
          document.getElementById('rv-access-gate')?.remove();
          // Fetch video URL now that payment is confirmed, then play
          if (_gateVideo) {
            const { data: rec } = await window.supabaseConfig.client
              .from('live_recordings').select('external_url').eq('id', _gateVideo.id).single();
            if (rec?.external_url) _gateVideo.videoUrl = rec.external_url;
            playVideo(_gateVideo);
          }
        },
      };
      const rzp = new window.Razorpay(options);
      rzp.on('payment.failed', (resp) => {
        btn.disabled = false;
        btn.textContent = 'Retry Payment';
        const msg = resp?.error?.description || resp?.error?.reason || 'Payment was declined. Please try a different payment method.';
        _showGateError(msg);
      });
      rzp.open();
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      btn.textContent = 'Pay Now via Razorpay';
      _showGateError(e.message || 'An unexpected error occurred. Please try again.');
    }
  }

  function _showGateError(msg) {
    const gate = document.getElementById('rv-access-gate');
    if (!gate) return;
    let err = gate.querySelector('#rv-gate-err');
    if (!err) {
      err = document.createElement('div');
      err.id = 'rv-gate-err';
      err.style.cssText = 'background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.3);border-radius:10px;padding:.55rem .75rem;font-size:.8rem;color:#f87171;margin-top:.6rem;text-align:left;line-height:1.5;';
      const payBtn = document.getElementById('rv-pay-btn');
      payBtn?.parentNode?.insertBefore(err, payBtn?.nextSibling);
    }
    err.textContent = msg;
    setTimeout(() => err?.remove(), 8000);
  }

  // ── Show video details in main panel before playing ──
  function showVideoDetails(id) {
    const v = allVideos.find(x => x.id === id);
    if (!v) return;

    // Populate details panel
    const courseTag  = document.getElementById('rv-dv-course-tag');
    const titleEl    = document.getElementById('rv-dv-title');

    // Detail chips: duration, session index, new badge
